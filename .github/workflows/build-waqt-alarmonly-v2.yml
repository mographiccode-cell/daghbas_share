name: Build WAQT Alarm Only v2

on:
  push:
    branches:
      - waqt-alarmonly-v2-build
    paths:
      - '.github/workflows/build-waqt-alarmonly-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout alarm-only branch
        uses: actions/checkout@v4
        with:
          ref: waqt-alarmonly-v2-build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Verify source, analyze, test, build and compare signing
        shell: bash
        run: |
          set -o pipefail
          rm -rf alarmonly_app alarmonly_source alarmonly_source.b64 alarmonly_source.zip ci-output-alarmonly
          mkdir -p ci-output-alarmonly
          set +e
          (
            set -e
            echo '=== TOOLCHAIN ==='
            flutter --version
            java -version
            echo '=== SOURCE INTEGRITY ==='
            cat ci/alarmonly/p00.txt ci/alarmonly/p01.txt ci/alarmonly/p02.txt ci/alarmonly/p03.txt > alarmonly_source.b64
            test "$(wc -c < alarmonly_source.b64)" -eq 34684
            base64 --decode alarmonly_source.b64 > alarmonly_source.zip
            echo 'a8842b4b6f218e96fefed2ef34594c015fc23a46be7e45a27c2b1e0780ec129c  alarmonly_source.zip' | sha256sum --check
            unzip -t alarmonly_source.zip
            mkdir alarmonly_source
            unzip -q alarmonly_source.zip -d alarmonly_source
            echo '=== CREATE CURRENT FLUTTER ANDROID SCAFFOLD ==='
            flutter create --platforms=android --org com.waqt --project-name waqt_alarm alarmonly_app
            echo '=== OVERLAY ALARM-ONLY SOURCE ==='
            cp -R alarmonly_source/lib alarmonly_app/
            rm -rf alarmonly_app/test
            cp -R alarmonly_source/test alarmonly_app/test
            cp alarmonly_source/pubspec.yaml alarmonly_app/pubspec.yaml
            cp alarmonly_source/analysis_options.yaml alarmonly_app/analysis_options.yaml
            cp alarmonly_source/android/app/src/main/AndroidManifest.xml alarmonly_app/android/app/src/main/AndroidManifest.xml
            mkdir -p alarmonly_app/android/app/src/main/res/drawable alarmonly_app/android/app/src/main/res/raw
            cp alarmonly_source/android/app/src/main/res/drawable/ic_stat_alarm.xml alarmonly_app/android/app/src/main/res/drawable/ic_stat_alarm.xml
            echo '=== PACKAGE + GRADLE ==='
            cat > alarmonly_app/android/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("dev.flutter.flutter-gradle-plugin")
          }
          android {
              namespace = "com.waqt.alarm"
              compileSdk = flutter.compileSdkVersion
              ndkVersion = flutter.ndkVersion
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  isCoreLibraryDesugaringEnabled = true
              }
              kotlin {
                  compilerOptions {
                      jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                  }
              }
              defaultConfig {
                  applicationId = "com.waqt.alarm"
                  minSdk = flutter.minSdkVersion
                  targetSdk = flutter.targetSdkVersion
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }
          flutter { source = "../.." }
          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          EOF
            grep -q 'applicationId = "com.waqt.alarm"' alarmonly_app/android/app/build.gradle.kts
            echo '=== APP ICON ==='
            rm -rf alarmonly_app/android/app/src/main/res/mipmap-*
            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p "alarmonly_app/android/app/src/main/res/mipmap-$density"
              cp alarmonly_source/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png "alarmonly_app/android/app/src/main/res/mipmap-$density/ic_launcher.png"
            done
            echo '=== GENERATE ALARM SOUNDS ==='
            python3 - <<'PY'
          import math, wave, struct
          from pathlib import Path
          sr=44100
          raw=Path('alarmonly_app/android/app/src/main/res/raw'); raw.mkdir(parents=True,exist_ok=True)
          def write(name,duration,fn,amp=.4):
              n=int(sr*duration)
              with wave.open(str(raw/f'{name}.wav'),'w') as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
                  frames=bytearray()
                  for i in range(n):
                      t=i/sr; v=max(-1,min(1,fn(t)))
                      frames += struct.pack('<h',int(v*amp*32767))
                  w.writeframes(frames)
          write('waqt_classic',4.0,lambda t: math.sin(2*math.pi*(880 if int(t*2)%2==0 else 660)*t)*(1 if (t%1)<.68 else 0))
          write('waqt_soft',5.0,lambda t: math.sin(2*math.pi*(440 if int(t)%2==0 else 523.25)*t)*(1 if (t%1)<.85 else 0),.25)
          write('waqt_digital',3.2,lambda t: math.sin(2*math.pi*1100*t)*(1 if (t%.4)<.18 else 0),.38)
          PY
            echo '=== VERIFY ALARM-ONLY SCOPE ==='
            ! grep -R -q "MedicationModel\|TaskReminder\|medicationById\|taskById" alarmonly_app/lib
            grep -q "المنبّه" alarmonly_app/lib/screens/alarms/alarms_screen.dart
            grep -q "تم ضبط المنب" alarmonly_app/lib/screens/alarms/alarm_editor_screen.dart
            grep -q "classic" alarmonly_app/lib/screens/alarms/alarm_editor_screen.dart
            test -s alarmonly_app/android/app/src/main/res/raw/waqt_classic.wav
            cd alarmonly_app
            echo '=== PUB GET ==='
            flutter pub get
            echo '=== ANALYZE ==='
            flutter analyze --no-fatal-infos
            echo '=== TEST ==='
            flutter test
            echo '=== RELEASE APK ==='
            flutter build apk --release --build-name=2.0.0 --build-number=4
            cd ..
            cp alarmonly_app/build/app/outputs/flutter-apk/app-release.apk ci-output-alarmonly/WAQT-Alarm-Only-v2.0.apk
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
            AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
            echo '=== APK VERIFY ==='
            "$APKSIGNER" verify --verbose --print-certs ci-output-alarmonly/WAQT-Alarm-Only-v2.0.apk | tee ci-output-alarmonly/new-cert.txt
            "$AAPT" dump badging ci-output-alarmonly/WAQT-Alarm-Only-v2.0.apk | head -5 | tee ci-output-alarmonly/package.txt
            grep -q "package: name='com.waqt.alarm'" ci-output-alarmonly/package.txt
            echo '=== COMPARE WITH PREVIOUS v1.2 SIGNER ==='
            set +e
            curl -fL --retry 3 -o /tmp/waqt-v12.apk 'https://raw.githubusercontent.com/mographiccode-cell/daghbas_share/waqt-v12-build/ci-output-v12/WAQT-Advanced-Alarm-v1.2.apk'
            old_dl=$?
            set -e
            if [ "$old_dl" -eq 0 ]; then
              "$APKSIGNER" verify --print-certs /tmp/waqt-v12.apk | tee ci-output-alarmonly/old-cert.txt
              old=$(grep 'Signer #1 certificate SHA-256 digest:' ci-output-alarmonly/old-cert.txt | sed 's/.*: //')
              new=$(grep 'Signer #1 certificate SHA-256 digest:' ci-output-alarmonly/new-cert.txt | sed 's/.*: //')
              if [ "$old" = "$new" ] && [ -n "$old" ]; then
                echo 'SIGNATURE_MATCH=true' | tee ci-output-alarmonly/update-compatibility.txt
              else
                echo 'SIGNATURE_MATCH=false' | tee ci-output-alarmonly/update-compatibility.txt
                echo "OLD_CERT=$old" >> ci-output-alarmonly/update-compatibility.txt
                echo "NEW_CERT=$new" >> ci-output-alarmonly/update-compatibility.txt
              fi
            else
              echo 'SIGNATURE_MATCH=unknown_old_apk_unavailable' | tee ci-output-alarmonly/update-compatibility.txt
            fi
            sha256sum ci-output-alarmonly/WAQT-Alarm-Only-v2.0.apk | tee ci-output-alarmonly/WAQT-Alarm-Only-v2.0.apk.sha256
            ls -lh ci-output-alarmonly/WAQT-Alarm-Only-v2.0.apk
            echo SUCCESS > ci-output-alarmonly/status.txt
          ) 2>&1 | tee ci-output-alarmonly/build.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then echo "FAILED:$result" > ci-output-alarmonly/status.txt; fi
          echo "pipeline_exit=$result" >> ci-output-alarmonly/status.txt
          exit "$result"

      - name: Publish build output
        if: always()
        shell: bash
        run: |
          mkdir -p ci-output-alarmonly
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f ci-output-alarmonly
          git commit -m 'ci: alarm-only APK result [skip ci]' || exit 0
          git push origin HEAD:waqt-alarmonly-v2-build

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WAQT-Alarm-Only-v2-APK
          path: |
            ci-output-alarmonly/WAQT-Alarm-Only-v2.0.apk
            ci-output-alarmonly/WAQT-Alarm-Only-v2.0.apk.sha256
            ci-output-alarmonly/update-compatibility.txt
          compression-level: 0
          retention-days: 30
