name: LocalShare osslsigncode Signing

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  windows:
    name: Windows osslsigncode signed installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: localshare-local-sign

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows project
        shell: pwsh
        run: |
          if (Test-Path generated) { Remove-Item generated -Recurse -Force }
          flutter config --enable-windows-desktop
          flutter create --org com.mographiccode --project-name local_share --platforms=windows generated
          Remove-Item generated/lib -Recurse -Force
          Remove-Item generated/test -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item flutter_local_share/lib generated/lib -Recurse
          Copy-Item flutter_local_share/test generated/test -Recurse
          Copy-Item flutter_local_share/pubspec.yaml generated/pubspec.yaml -Force
          python flutter_local_share/tools/patch_windows_temp_cleanup.py generated/windows/runner/main.cpp

      - name: Generate LocalShare icon
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          python flutter_local_share/tools/generate_localshare_icon.py localshare_icon.png
          @'
          from PIL import Image
          from pathlib import Path
          src=Image.open('localshare_icon.png').convert('RGBA')
          out=Path('generated/windows/runner/resources/app_icon.ico')
          out.parent.mkdir(parents=True,exist_ok=True)
          src.save(out,sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content icon_build.py -Encoding UTF8
          python icon_build.py

      - name: Analyze test and build
        working-directory: generated
        shell: pwsh
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
          flutter build windows --release

      - name: Prepare LocalShare certificate and osslsigncode
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts,signing-tools | Out-Null
          $pfxPassword='LocalShare-CI-2026-Temp!'
          $rsa=[System.Security.Cryptography.RSA]::Create(3072)
          $dn=[System.Security.Cryptography.X509Certificates.X500DistinguishedName]::new('CN=MographicCode LocalShare, O=MographicCode')
          $req=[System.Security.Cryptography.X509Certificates.CertificateRequest]::new($dn,$rsa,[System.Security.Cryptography.HashAlgorithmName]::SHA256,[System.Security.Cryptography.RSASignaturePadding]::Pkcs1)
          $oids=[System.Security.Cryptography.OidCollection]::new()
          [void]$oids.Add([System.Security.Cryptography.Oid]::new('1.3.6.1.5.5.7.3.3','Code Signing'))
          $req.CertificateExtensions.Add([System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]::new($oids,$false))
          $req.CertificateExtensions.Add([System.Security.Cryptography.X509Certificates.X509BasicConstraintsExtension]::new($false,$false,0,$true))
          $req.CertificateExtensions.Add([System.Security.Cryptography.X509Certificates.X509KeyUsageExtension]::new([System.Security.Cryptography.X509Certificates.X509KeyUsageFlags]::DigitalSignature,$true))
          $cert=$req.CreateSelfSigned((Get-Date).AddDays(-1),(Get-Date).AddYears(3))
          [System.IO.File]::WriteAllBytes((Join-Path $PWD 'artifacts/LocalShare-Code-Signing.pfx'),$cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Pfx,$pfxPassword))
          [System.IO.File]::WriteAllBytes((Join-Path $PWD 'artifacts/LocalShare-Code-Signing.cer'),$cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          Import-Certificate -FilePath artifacts/LocalShare-Code-Signing.cer -CertStoreLocation 'Cert:\CurrentUser\Root' | Out-Null
          Import-Certificate -FilePath artifacts/LocalShare-Code-Signing.cer -CertStoreLocation 'Cert:\CurrentUser\TrustedPublisher' | Out-Null
          $cert | Format-List Subject,Issuer,Thumbprint,NotBefore,NotAfter | Out-File artifacts/LocalShare-Certificate-Info.txt -Encoding UTF8
          Write-Host "CERT_READY $($cert.Thumbprint)"

          $url='https://github.com/mtrojnar/osslsigncode/releases/download/2.14/osslsigncode-2.14-windows-x64-mingw.zip'
          $zip='signing-tools/osslsigncode.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '9a1722aaf62a27852c4eb9c35749a0248065052d0ae0a93d4ed6bb49def027f2') { throw "Unexpected osslsigncode archive hash: $hash" }
          Expand-Archive $zip -DestinationPath signing-tools/osslsigncode -Force
          $ossl=(Get-ChildItem signing-tools/osslsigncode -Recurse -Filter osslsigncode.exe | Select-Object -First 1).FullName
          if (-not $ossl) { throw 'osslsigncode.exe not found after extraction' }
          & $ossl --version
          if ($LASTEXITCODE -ne 0) { throw 'osslsigncode failed to execute' }
          Set-Content artifacts/osslsigncode-path.txt $ossl -Encoding ASCII

      - name: Authenticode sign LocalShare EXE
        shell: pwsh
        run: |
          $pfxPassword='LocalShare-CI-2026-Temp!'
          $pfx=(Resolve-Path 'artifacts/LocalShare-Code-Signing.pfx').Path
          $ossl=Get-Content artifacts/osslsigncode-path.txt -Raw
          $ossl=$ossl.Trim()
          $exe=(Resolve-Path 'generated/build/windows/x64/runner/Release/local_share.exe').Path
          $signed="$exe.signed.exe"
          Write-Host 'SIGN_EXE_START'
          & $ossl sign -pkcs12 $pfx -pass $pfxPassword -n 'LocalShare' -i 'https://github.com/mographiccode-cell/daghbas_share' -h sha256 -in $exe -out $signed
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $signed)) { throw 'osslsigncode failed to sign local_share.exe' }
          Move-Item $signed $exe -Force
          $sig=Get-AuthenticodeSignature $exe
          if ($sig.Status -ne 'Valid') { throw "local_share.exe Authenticode status: $($sig.Status)" }
          if ($sig.SignerCertificate.Subject -notlike '*MographicCode LocalShare*') { throw 'Unexpected local_share.exe signer' }
          Write-Host "SIGN_EXE_DONE $($sig.SignerCertificate.Thumbprint)"

      - name: Build and Authenticode sign installer
        shell: pwsh
        run: |
          $release=(Resolve-Path 'generated/build/windows/x64/runner/Release').Path
          $setupIcon=(Resolve-Path 'generated/windows/runner/resources/app_icon.ico').Path
          $iss=@"
          [Setup]
          AppId={{8D2D488C-246B-4BDC-8C24-7B10A65B9649}
          AppName=LocalShare
          AppVersion=1.2.0
          AppPublisher=MographicCode LocalShare
          DefaultDirName={autopf}\LocalShare
          DefaultGroupName=LocalShare
          OutputDir=$($PWD.Path)\artifacts
          OutputBaseFilename=LocalShare-1.2-Windows-Setup-Unsigned
          SetupIconFile=$setupIcon
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=admin
          UninstallDisplayIcon={app}\local_share.exe

          [Files]
          Source: "$release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\LocalShare"; Filename: "{app}\local_share.exe"; WorkingDir: "{app}"; IconFilename: "{app}\local_share.exe"
          Name: "{autodesktop}\LocalShare"; Filename: "{app}\local_share.exe"; WorkingDir: "{app}"; IconFilename: "{app}\local_share.exe"

          [Run]
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall add rule name=""LocalShare TCP"" dir=in action=allow protocol=TCP localport=40404 profile=private"; Flags: runhidden
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall add rule name=""LocalShare UDP Discovery"" dir=in action=allow protocol=UDP localport=40405 profile=private"; Flags: runhidden

          [UninstallRun]
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall delete rule name=""LocalShare TCP"""; Flags: runhidden; RunOnceId: "RemoveLocalShareTcp"
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall delete rule name=""LocalShare UDP Discovery"""; Flags: runhidden; RunOnceId: "RemoveLocalShareUdp"
          "@
          Set-Content installer.iss $iss -Encoding UTF8
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }

          $pfxPassword='LocalShare-CI-2026-Temp!'
          $pfx=(Resolve-Path 'artifacts/LocalShare-Code-Signing.pfx').Path
          $ossl=(Get-Content artifacts/osslsigncode-path.txt -Raw).Trim()
          $unsigned=(Resolve-Path 'artifacts/LocalShare-1.2-Windows-Setup-Unsigned.exe').Path
          $signed=(Join-Path $PWD 'artifacts/LocalShare-1.2-Windows-Setup-Signed.exe')
          Write-Host 'SIGN_INSTALLER_START'
          & $ossl sign -pkcs12 $pfx -pass $pfxPassword -n 'LocalShare 1.2 Installer' -i 'https://github.com/mographiccode-cell/daghbas_share' -h sha256 -in $unsigned -out $signed
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $signed)) { throw 'osslsigncode failed to sign installer' }
          Remove-Item $unsigned -Force
          $sig=Get-AuthenticodeSignature $signed
          if ($sig.Status -ne 'Valid') { throw "Installer Authenticode status: $($sig.Status)" }
          if ($sig.SignerCertificate.Subject -notlike '*MographicCode LocalShare*') { throw 'Unexpected installer signer' }
          Write-Host "SIGN_INSTALLER_DONE $($sig.SignerCertificate.Thumbprint)"
          Get-FileHash $signed -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  LocalShare-1.2-Windows-Setup-Signed.exe" } | Set-Content artifacts/LocalShare-1.2-Windows-Setup-Signed.exe.sha256
          Remove-Item artifacts/LocalShare-Code-Signing.pfx -Force

      - name: Create trust helper ZIP
        shell: pwsh
        run: |
          @'
          @echo off
          setlocal
          net session >nul 2>&1
          if not %errorlevel%==0 (
            powershell -NoProfile -Command "Start-Process -FilePath '%~f0' -Verb RunAs"
            exit /b
          )
          echo Installing MographicCode LocalShare public code-signing certificate...
          certutil -addstore -f Root "%~dp0LocalShare-Code-Signing.cer" || exit /b 1
          certutil -addstore -f TrustedPublisher "%~dp0LocalShare-Code-Signing.cer" || exit /b 1
          echo Starting signed LocalShare installer...
          start "" "%~dp0LocalShare-1.2-Windows-Setup-Signed.exe"
          endlocal
          '@ | Set-Content artifacts/1-TRUST-AND-INSTALL.cmd -Encoding ASCII

          @'
          LocalShare 1.2 - Authenticode signed local package

          Extract the ZIP completely, then run 1-TRUST-AND-INSTALL.cmd as Administrator.
          It adds ONLY the included public MographicCode LocalShare certificate to Windows Root and TrustedPublisher stores, then opens the installer signed by that certificate.

          This is a locally/self-issued certificate. It establishes explicit trust on the PC where the CER is installed, but it is not a globally trusted commercial CA certificate. It does not disable Defender, SmartScreen, or Smart App Control. CA-only enterprise/Smart App Control policy can still require a public CA or Microsoft signing service.
          '@ | Set-Content artifacts/README-FIRST.txt -Encoding UTF8

          Compress-Archive -Path artifacts/LocalShare-1.2-Windows-Setup-Signed.exe,artifacts/LocalShare-Code-Signing.cer,artifacts/LocalShare-Certificate-Info.txt,artifacts/LocalShare-1.2-Windows-Setup-Signed.exe.sha256,artifacts/1-TRUST-AND-INSTALL.cmd,artifacts/README-FIRST.txt -DestinationPath artifacts/LocalShare-1.2-Windows-Signed-Package.zip -Force

      - name: Verify install run uninstall
        shell: pwsh
        run: |
          $setup=(Resolve-Path 'artifacts/LocalShare-1.2-Windows-Setup-Signed.exe').Path
          $sig=Get-AuthenticodeSignature $setup
          if ($sig.Status -ne 'Valid') { throw "Installer not trusted in CI: $($sig.Status)" }
          $install=Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $exe='C:\Program Files\LocalShare\local_share.exe'
          if (-not (Test-Path $exe)) { throw 'Installed LocalShare executable missing' }
          $appSig=Get-AuthenticodeSignature $exe
          if ($appSig.Status -ne 'Valid') { throw "Installed EXE Authenticode status: $($appSig.Status)" }
          $proc=Start-Process $exe -PassThru
          Start-Sleep 6
          if ($proc.HasExited) { throw 'LocalShare exited unexpectedly' }
          $proc.CloseMainWindow() | Out-Null
          if (-not $proc.WaitForExit(10000)) { Stop-Process -Id $proc.Id -Force }
          $uninstaller='C:\Program Files\LocalShare\unins000.exe'
          $u=Start-Process $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw 'Uninstall failed' }

      - uses: actions/upload-artifact@v4
        with:
          name: LocalShare-1.2-Windows-Signed-Package
          path: artifacts/LocalShare-1.2-Windows-Signed-Package.zip
          if-no-files-found: error
