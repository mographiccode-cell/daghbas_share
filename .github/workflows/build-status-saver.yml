name: Build WhatsApp Status Saver APK

on:
  push:
    branches:
      - status-saver-build-20260825
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Create clean Flutter Android project
        run: |
          rm -rf build_status_saver
          flutter create --platforms=android --org=com.mographiccode --project-name=status_saver build_status_saver
          rm -f build_status_saver/test/widget_test.dart

      - name: Apply Status Saver source
        run: |
          cp status_saver_ci/lib/main.dart build_status_saver/lib/main.dart
          cp status_saver_ci/test/status_item_test.dart build_status_saver/test/status_item_test.dart
          cp status_saver_ci/android/MainActivity.kt build_status_saver/android/app/src/main/kotlin/com/mographiccode/status_saver/MainActivity.kt
          cp status_saver_ci/android/AndroidManifest.xml build_status_saver/android/app/src/main/AndroidManifest.xml

      - name: Format Dart
        working-directory: build_status_saver
        run: dart format lib test

      - name: Flutter analyze
        working-directory: build_status_saver
        run: flutter analyze

      - name: Flutter tests
        working-directory: build_status_saver
        run: flutter test

      - name: Build release APK
        working-directory: build_status_saver
        run: flutter build apk --release

      - name: Create temporary release signing key
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/status-saver-release.jks" \
            -storepass status-saver-build \
            -keypass status-saver-build \
            -alias status-saver \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Status Saver, OU=Mobile, O=MographicCode, L=Aden, ST=Aden, C=YE"

      - name: Sign APK with v1 v2 v3
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/status-saver-release.jks" \
            --ks-key-alias status-saver \
            --ks-pass pass:status-saver-build \
            --key-pass pass:status-saver-build \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out build_status_saver/build/app/outputs/flutter-apk/StatusSaver-v1.0.0.apk \
            build_status_saver/build/app/outputs/flutter-apk/app-release.apk

      - name: Verify signed APK
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -s build_status_saver/build/app/outputs/flutter-apk/StatusSaver-v1.0.0.apk
          "$APKSIGNER" verify --verbose --print-certs build_status_saver/build/app/outputs/flutter-apk/StatusSaver-v1.0.0.apk
          unzip -t build_status_saver/build/app/outputs/flutter-apk/StatusSaver-v1.0.0.apk >/dev/null
          ls -lh build_status_saver/build/app/outputs/flutter-apk/StatusSaver-v1.0.0.apk
          sha256sum build_status_saver/build/app/outputs/flutter-apk/StatusSaver-v1.0.0.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StatusSaver-Signed-APK
          path: build_status_saver/build/app/outputs/flutter-apk/StatusSaver-v1.0.0.apk
          if-no-files-found: error
          retention-days: 7
