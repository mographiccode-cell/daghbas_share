name: Build WhatsApp Status Saver APK

on:
  push:
    branches:
      - status-saver-build-20260825
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Create clean Flutter Android project
        run: |
          rm -rf build_status_saver
          flutter create --platforms=android --org=com.mographiccode --project-name=status_saver build_status_saver
          rm -f build_status_saver/test/widget_test.dart

      - name: Apply Status Saver source and exact icon
        run: |
          cp status_saver_ci/lib/main.dart build_status_saver/lib/main.dart
          cp status_saver_ci/test/status_item_test.dart build_status_saver/test/status_item_test.dart
          cp status_saver_ci/android/MainActivity.kt build_status_saver/android/app/src/main/kotlin/com/mographiccode/status_saver/MainActivity.kt
          cp status_saver_ci/android/AndroidManifest.xml build_status_saver/android/app/src/main/AndroidManifest.xml
          mkdir -p build_status_saver/assets
          cp status_saver_ci/assets/app_icon.png build_status_saver/assets/app_icon.png
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build_status_saver/pubspec.yaml')
          text = p.read_text()
          needle = '  uses-material-design: true\n'
          if needle not in text:
              raise SystemExit('uses-material-design entry not found')
          if 'assets/app_icon.png' not in text:
              text = text.replace(needle, needle + '  assets:\n    - assets/app_icon.png\n', 1)
          p.write_text(text)
          PY

      - name: Install exact raster launcher icon
        run: |
          rm -f build_status_saver/android/app/src/main/res/mipmap-*/ic_launcher*.png
          rm -f build_status_saver/android/app/src/main/res/mipmap-*/ic_launcher*.webp
          rm -f build_status_saver/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher*.xml
          mkdir -p build_status_saver/android/app/src/main/res/mipmap-xxxhdpi
          cp status_saver_ci/assets/app_icon.png build_status_saver/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp status_saver_ci/assets/app_icon.png build_status_saver/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          test -s build_status_saver/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cmp status_saver_ci/assets/app_icon.png build_status_saver/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Secure Android minimum SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = [
              Path('build_status_saver/android/app/build.gradle.kts'),
              Path('build_status_saver/android/app/build.gradle'),
          ]
          p = next((x for x in candidates if x.exists()), None)
          if p is None:
              raise SystemExit('Android app Gradle file not found')
          text = p.read_text()
          replacements = [
              ('minSdk = flutter.minSdkVersion', 'minSdk = 29'),
              ('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 29'),
          ]
          for old, new in replacements:
              if old in text:
                  p.write_text(text.replace(old, new, 1))
                  break
          else:
              raise SystemExit('Could not set minSdk to 29')
          PY

      - name: Static privacy and manifest checks
        run: |
          grep -q 'android:allowBackup="false"' status_saver_ci/android/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' status_saver_ci/android/AndroidManifest.xml
          ! grep -Eq 'MANAGE_EXTERNAL_STORAGE|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|READ_CONTACTS|READ_SMS|CAMERA|RECORD_AUDIO|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|QUERY_ALL_PACKAGES|android.permission.INTERNET' status_saver_ci/android/AndroidManifest.xml
          ! grep -Eq '^\s*<uses-permission' status_saver_ci/android/AndroidManifest.xml

      - name: Format Dart
        working-directory: build_status_saver
        run: dart format lib test

      - name: Flutter analyze
        working-directory: build_status_saver
        run: flutter analyze

      - name: Flutter tests
        working-directory: build_status_saver
        run: flutter test

      - name: Build release APK
        working-directory: build_status_saver
        run: flutter build apk --release --build-name=1.1.0 --build-number=2

      - name: Inspect compiled APK security and branding
        run: |
          APK=build_status_saver/build/app/outputs/flutter-apk/app-release.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          "$AAPT" dump permissions "$APK" | tee "$RUNNER_TEMP/permissions.txt"
          grep -q "package: name='com.mographiccode.status_saver'" "$RUNNER_TEMP/badging.txt"
          grep -q "sdkVersion:'29'" "$RUNNER_TEMP/badging.txt"
          grep -q "application-label:'حافظ الحالات'" "$RUNNER_TEMP/badging.txt"
          grep -Eq "application: label='حافظ الحالات' icon='res/.+\.png'" "$RUNNER_TEMP/badging.txt"
          grep -Eq "application-icon-[0-9]+:'res/.+\.png'" "$RUNNER_TEMP/badging.txt"
          ! grep -Eq 'MANAGE_EXTERNAL_STORAGE|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|READ_CONTACTS|READ_SMS|CAMERA|RECORD_AUDIO|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|QUERY_ALL_PACKAGES|android.permission.INTERNET' "$RUNNER_TEMP/permissions.txt"

      - name: Create temporary release signing key
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/status-saver-release.jks" \
            -storepass status-saver-build \
            -keypass status-saver-build \
            -alias status-saver \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Status Saver, OU=Mobile, O=MographicCode, L=Aden, ST=Aden, C=YE"

      - name: Sign APK with Android v3 signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/status-saver-release.jks" \
            --ks-key-alias status-saver \
            --ks-pass pass:status-saver-build \
            --key-pass pass:status-saver-build \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out build_status_saver/build/app/outputs/flutter-apk/StatusSaver-v1.1.0.apk \
            build_status_saver/build/app/outputs/flutter-apk/app-release.apk

      - name: Verify signed APK
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          APK=build_status_saver/build/app/outputs/flutter-apk/StatusSaver-v1.1.0.apk
          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/signature.txt"
          grep -q '^Verifies$' "$RUNNER_TEMP/signature.txt"
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' "$RUNNER_TEMP/signature.txt"
          unzip -t "$APK" >/dev/null
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StatusSaver-v1.1.0-ExactIcon-Signed-APK
          path: build_status_saver/build/app/outputs/flutter-apk/StatusSaver-v1.1.0.apk
          if-no-files-found: error
          retention-days: 7
