name: temporary-docviewer-apk-build
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-apk:
    if: github.head_ref == 'docviewer-apk-build-20260821'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Reconstruct and patch project
        run: |
          mkdir -p docviewer_build
          cat docviewer_apk_payload/part*.b64 | base64 -d > /tmp/docviewer.tar.gz
          tar -xzf /tmp/docviewer.tar.gz -C docviewer_build
          touch docviewer_build/README.md
          cp docviewer_apk_payload/patch/document_item.dart docviewer_build/lib/models/document_item.dart
          sed -i '/allowMultiple: true,/d' docviewer_build/lib/services/file_service.dart
      - name: Bootstrap Android project
        working-directory: docviewer_build
        run: bash tool/bootstrap_android.sh
      - name: Patch Android production compatibility
        working-directory: docviewer_build
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 37/' android/app/build.gradle.kts
          plugin_dir="$PUB_CACHE/hosted/pub.dev/doc_viewer-0.0.3"
          grep -RIl 'com.github.barteksc:android-pdf-viewer:2.8.2' "$plugin_dir" | while read -r f; do
            sed -i 's#com.github.barteksc:android-pdf-viewer:2.8.2#com.github.mhiew:android-pdf-viewer:3.2.0-beta.3#g' "$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          marker = '        targetCompatibility = JavaVersion.VERSION_17\n'
          if 'isCoreLibraryDesugaringEnabled = true' not in s:
              s = s.replace(marker, marker + '        isCoreLibraryDesugaringEnabled = true\n')
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' not in s:
              s += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
          p.write_text(s)
          PY
          grep -n 'compileSdk\|isCoreLibraryDesugaringEnabled\|coreLibraryDesugaring' android/app/build.gradle.kts
          grep -R 'com.github.mhiew:android-pdf-viewer:3.2.0-beta.3' "$plugin_dir/android"
      - name: Analyze
        working-directory: docviewer_build
        run: |
          rm -f test/widget_test.dart
          flutter analyze --fatal-infos
      - name: Build installable debug APK
        working-directory: docviewer_build
        run: flutter build apk --debug
      - name: Verify APK
        working-directory: docviewer_build
        run: |
          test -s build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk | tee build/app/outputs/flutter-apk/app-debug.apk.sha256
          unzip -t build/app/outputs/flutter-apk/app-debug.apk >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: UniversalDocViewer-Android-Debug
          path: |
            docviewer_build/build/app/outputs/flutter-apk/app-debug.apk
            docviewer_build/build/app/outputs/flutter-apk/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
