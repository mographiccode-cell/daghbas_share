name: Fetch TasteAI UCI Full Dataset
on:
  push:
    branches: [tasteai-uci-full-dataset-20260818]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch full UCI mirror
        run: |
          set -euxo pipefail
          mkdir -p uci_full
          base='https://raw.githubusercontent.com/liyenhsu/restaurant-data-with-consumer-ratings/master/data'
          for f in README.txt chefmozaccepts.csv chefmozcuisine.csv chefmozhours4.csv chefmozparking.csv geoplaces2.csv rating_final.csv usercuisine.csv userpayment.csv userprofile.csv; do
            curl -fL "$base/$f" -o "uci_full/$f"
          done
          sha256sum uci_full/* > uci_full/SHA256SUMS.txt
          zip -r uci_full.zip uci_full
      - name: Run robust OOF diagnostics
        run: |
          python -m pip install -q numpy pandas scikit-learn
          python tasteai_diag/diagnose_full_uci.py | tee diagnostic_console.txt
      - uses: actions/upload-artifact@v4
        with:
          name: uci-full-dataset
          path: uci_full.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tasteai-diagnostic-results
          path: |
            diag_out
            diagnostic_console.txt
