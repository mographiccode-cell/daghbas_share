name: LocalShare Local Code-Signed Package V2

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  windows:
    name: Windows locally signed package
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: localshare-local-sign

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows project with strict temp cleanup
        shell: pwsh
        run: |
          if (Test-Path generated) { Remove-Item generated -Recurse -Force }
          flutter config --enable-windows-desktop
          flutter create --org com.mographiccode --project-name local_share --platforms=windows generated
          Remove-Item generated/lib -Recurse -Force
          Remove-Item generated/test -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item flutter_local_share/lib generated/lib -Recurse
          Copy-Item flutter_local_share/test generated/test -Recurse
          Copy-Item flutter_local_share/pubspec.yaml generated/pubspec.yaml -Force
          python flutter_local_share/tools/patch_windows_temp_cleanup.py generated/windows/runner/main.cpp

      - name: Generate and apply LocalShare icon
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          python flutter_local_share/tools/generate_localshare_icon.py localshare_icon.png
          @'
          from PIL import Image
          from pathlib import Path
          src=Image.open('localshare_icon.png').convert('RGBA')
          assert src.size == (512,512)
          out=Path('generated/windows/runner/resources/app_icon.ico')
          out.parent.mkdir(parents=True,exist_ok=True)
          src.save(out,sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content icon_build.py -Encoding UTF8
          python icon_build.py

      - name: Analyze test and build Windows
        working-directory: generated
        shell: pwsh
        run: |
          flutter pub get
          dart format lib test
          flutter analyze --fatal-warnings --no-fatal-infos
          flutter test
          flutter build windows --release

      - name: Create LocalShare RSA certificate and Authenticode-sign binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject 'CN=MographicCode LocalShare, O=MographicCode' `
            -FriendlyName 'LocalShare Local Code Signing' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyAlgorithm RSA `
            -KeyLength 3072 `
            -HashAlgorithm SHA256 `
            -KeyExportPolicy NonExportable `
            -NotAfter (Get-Date).AddYears(3)
          if (-not $cert) { throw 'Failed to create LocalShare certificate' }
          Export-Certificate -Cert $cert -FilePath artifacts/LocalShare-Local-Code-Signing.cer | Out-Null

          $release=(Resolve-Path 'generated/build/windows/x64/runner/Release').Path
          $targets=Get-ChildItem $release -Recurse -File | Where-Object { $_.Extension -in '.exe','.dll' }
          if (-not $targets) { throw 'No Windows PE binaries found' }
          foreach ($target in $targets) {
            Set-AuthenticodeSignature -FilePath $target.FullName -Certificate $cert -HashAlgorithm SHA256 | Out-Null
            $sig=Get-AuthenticodeSignature $target.FullName
            if (-not $sig.SignerCertificate -or $sig.SignerCertificate.Thumbprint -ne $cert.Thumbprint) {
              throw "Authenticode signature was not embedded: $($target.FullName)"
            }
          }

          Import-Certificate -FilePath artifacts/LocalShare-Local-Code-Signing.cer -CertStoreLocation 'Cert:\CurrentUser\Root' | Out-Null
          Import-Certificate -FilePath artifacts/LocalShare-Local-Code-Signing.cer -CertStoreLocation 'Cert:\CurrentUser\TrustedPublisher' | Out-Null
          $mainExe=Join-Path $release 'local_share.exe'
          $mainSig=Get-AuthenticodeSignature $mainExe
          if ($mainSig.Status -ne 'Valid') { throw "LocalShare EXE signature is not valid after local trust: $($mainSig.Status)" }
          $cert | Format-List Subject,Issuer,Thumbprint,NotBefore,NotAfter | Out-File artifacts/LocalShare-Certificate-Info.txt -Encoding UTF8

      - name: Build and Authenticode-sign installer
        shell: pwsh
        run: |
          $release=(Resolve-Path 'generated/build/windows/x64/runner/Release').Path
          $setupIcon=(Resolve-Path 'generated/windows/runner/resources/app_icon.ico').Path
          $iss=@"
          [Setup]
          AppId={{8D2D488C-246B-4BDC-8C24-7B10A65B9649}
          AppName=LocalShare
          AppVersion=1.2.0
          AppPublisher=MographicCode
          DefaultDirName={autopf}\LocalShare
          DefaultGroupName=LocalShare
          OutputDir=$($PWD.Path)\artifacts
          OutputBaseFilename=LocalShare-1.2-Windows-Setup-LocalSigned
          SetupIconFile=$setupIcon
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=admin
          UninstallDisplayIcon={app}\local_share.exe

          [Files]
          Source: "$release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\LocalShare"; Filename: "{app}\local_share.exe"; WorkingDir: "{app}"; IconFilename: "{app}\local_share.exe"
          Name: "{autodesktop}\LocalShare"; Filename: "{app}\local_share.exe"; WorkingDir: "{app}"; IconFilename: "{app}\local_share.exe"

          [Run]
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall add rule name=""LocalShare TCP"" dir=in action=allow protocol=TCP localport=40404 profile=private"; Flags: runhidden
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall add rule name=""LocalShare UDP Discovery"" dir=in action=allow protocol=UDP localport=40405 profile=private"; Flags: runhidden

          [UninstallRun]
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall delete rule name=""LocalShare TCP"""; Flags: runhidden; RunOnceId: "RemoveLocalShareTcp"
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall delete rule name=""LocalShare UDP Discovery"""; Flags: runhidden; RunOnceId: "RemoveLocalShareUdp"
          "@
          Set-Content installer.iss $iss -Encoding UTF8
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $cert=Get-ChildItem 'Cert:\CurrentUser\My' | Where-Object { $_.Subject -like '*MographicCode LocalShare*' } | Sort-Object NotBefore -Descending | Select-Object -First 1
          if (-not $cert) { throw 'LocalShare certificate missing' }
          $setup=(Resolve-Path 'artifacts/LocalShare-1.2-Windows-Setup-LocalSigned.exe').Path
          Set-AuthenticodeSignature -FilePath $setup -Certificate $cert -HashAlgorithm SHA256 | Out-Null
          $sig=Get-AuthenticodeSignature $setup
          if ($sig.Status -ne 'Valid') { throw "Installer Authenticode status: $($sig.Status)" }
          if ($sig.SignerCertificate.Subject -notlike '*MographicCode LocalShare*') { throw 'Unexpected installer signer' }
          Get-FileHash $setup -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  LocalShare-1.2-Windows-Setup-LocalSigned.exe" } | Set-Content artifacts/LocalShare-1.2-Windows-Setup-LocalSigned.exe.sha256

      - name: Create trust helper and ZIP
        shell: pwsh
        run: |
          @'
          @echo off
          setlocal
          net session >nul 2>&1
          if not %errorlevel%==0 (
            powershell -NoProfile -Command "Start-Process -FilePath '%~f0' -Verb RunAs"
            exit /b
          )
          echo Installing the LocalShare public code-signing certificate...
          certutil -addstore -f Root "%~dp0LocalShare-Local-Code-Signing.cer" || exit /b 1
          certutil -addstore -f TrustedPublisher "%~dp0LocalShare-Local-Code-Signing.cer" || exit /b 1
          echo LocalShare certificate trusted on this PC.
          start "" "%~dp0LocalShare-1.2-Windows-Setup-LocalSigned.exe"
          endlocal
          '@ | Set-Content artifacts/1-TRUST-AND-INSTALL-LOCALSHARE.cmd -Encoding ASCII

          @'
          LOCALSHARE 1.2 - LOCAL RSA CODE-SIGNED PACKAGE

          Publisher embedded in the EXE signature: MographicCode LocalShare
          Signature: Authenticode / RSA 3072 / SHA-256

          INSTALL ON THIS PC:
          1) Extract this ZIP completely.
          2) Right-click 1-TRUST-AND-INSTALL-LOCALSHARE.cmd and choose Run as administrator.
          3) Accept the UAC prompt. It installs ONLY the included LocalShare public certificate into this PC's Root and TrustedPublisher stores, then starts the signed installer.
          4) You can inspect LocalShare-Local-Code-Signing.cer before trusting it.

          This does NOT disable Windows Defender, SmartScreen, or Smart App Control.
          The certificate is local/development trust, not a public CA certificate.
          '@ | Set-Content artifacts/README-FIRST.txt -Encoding UTF8

          Compress-Archive -Path artifacts/LocalShare-1.2-Windows-Setup-LocalSigned.exe,artifacts/LocalShare-Local-Code-Signing.cer,artifacts/LocalShare-Certificate-Info.txt,artifacts/LocalShare-1.2-Windows-Setup-LocalSigned.exe.sha256,artifacts/1-TRUST-AND-INSTALL-LOCALSHARE.cmd,artifacts/README-FIRST.txt -DestinationPath artifacts/LocalShare-1.2-Windows-LocalSigned-Package.zip -Force

      - name: Install signed package and verify runtime
        shell: pwsh
        run: |
          $setup=(Resolve-Path 'artifacts/LocalShare-1.2-Windows-Setup-LocalSigned.exe').Path
          if ((Get-AuthenticodeSignature $setup).Status -ne 'Valid') { throw 'Installer signature invalid in trusted test environment' }
          $install=Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $exe='C:\Program Files\LocalShare\local_share.exe'
          if (-not (Test-Path $exe)) { throw 'Installed LocalShare executable missing' }
          if ((Get-AuthenticodeSignature $exe).Status -ne 'Valid') { throw 'Installed LocalShare signature invalid' }
          $proc=Start-Process $exe -PassThru
          Start-Sleep 6
          if ($proc.HasExited) { throw 'LocalShare exited unexpectedly' }
          $proc.CloseMainWindow() | Out-Null
          if (-not $proc.WaitForExit(10000)) { Stop-Process -Id $proc.Id -Force }
          $uninstaller='C:\Program Files\LocalShare\unins000.exe'
          $uninstall=Start-Process $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstall failed' }

      - uses: actions/upload-artifact@v4
        with:
          name: LocalShare-1.2-Windows-LocalSigned-Package-V2
          path: artifacts/LocalShare-1.2-Windows-LocalSigned-Package.zip
          if-no-files-found: error
