name: LocalShare Sign Existing Installer

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  sign:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LocalShare-Windows-Final-StrictCleanup
          path: unsigned
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 32587475264

      - name: Create LocalShare code-signing certificate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $cert=New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=MographicCode LocalShare' -FriendlyName 'MographicCode LocalShare Code Signing' -CertStoreLocation 'Cert:\CurrentUser\My' -KeyAlgorithm RSA -KeyLength 3072 -HashAlgorithm SHA256 -KeyExportPolicy NonExportable -NotAfter (Get-Date).AddYears(3)
          if (-not $cert) { throw 'Certificate creation failed' }
          Export-Certificate -Cert $cert -FilePath out/LocalShare-Code-Signing.cer | Out-Null
          $cert.Thumbprint | Set-Content out/thumbprint.txt -Encoding ASCII
          $cert | Format-List Subject,Issuer,Thumbprint,NotBefore,NotAfter | Out-File out/LocalShare-Certificate-Info.txt -Encoding UTF8

      - name: Sign final LocalShare installer
        shell: pwsh
        run: |
          $thumb=(Get-Content out/thumbprint.txt -Raw).Trim()
          $cert=Get-Item "Cert:\CurrentUser\My\$thumb"
          $src=(Resolve-Path 'unsigned/LocalShare-Windows-Setup.exe').Path
          $dst=(Join-Path $PWD 'out/LocalShare-1.2-Windows-Setup-Signed.exe')
          Copy-Item $src $dst -Force
          $result=Set-AuthenticodeSignature -FilePath $dst -Certificate $cert -HashAlgorithm SHA256
          if (-not $result.SignerCertificate) { throw 'Signature was not embedded' }
          if ($result.SignerCertificate.Thumbprint -ne $thumb) { throw 'Unexpected signer thumbprint' }
          Get-FileHash $dst -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  LocalShare-1.2-Windows-Setup-Signed.exe" } | Set-Content out/LocalShare-1.2-Windows-Setup-Signed.exe.sha256 -Encoding ASCII

      - name: Create trust and install helper
        shell: pwsh
        run: |
          @'
          @echo off
          setlocal
          net session >nul 2>&1
          if not %errorlevel%==0 (
            powershell -NoProfile -Command "Start-Process -FilePath '%~f0' -Verb RunAs"
            exit /b
          )
          certutil -addstore -f Root "%~dp0LocalShare-Code-Signing.cer" || exit /b 1
          certutil -addstore -f TrustedPublisher "%~dp0LocalShare-Code-Signing.cer" || exit /b 1
          start "" "%~dp0LocalShare-1.2-Windows-Setup-Signed.exe"
          endlocal
          '@ | Set-Content out/1-TRUST-AND-INSTALL.cmd -Encoding ASCII
          @'
          LocalShare 1.2 Windows locally signed installer
          Publisher certificate: MographicCode LocalShare
          Authenticode: RSA 3072 / SHA-256

          Extract the ZIP, then right-click 1-TRUST-AND-INSTALL.cmd and choose Run as administrator.
          The helper installs only the included LocalShare public certificate into Windows Root and TrustedPublisher stores, then starts the signed installer.
          '@ | Set-Content out/README-FIRST.txt -Encoding UTF8
          Compress-Archive -Path out/LocalShare-1.2-Windows-Setup-Signed.exe,out/LocalShare-Code-Signing.cer,out/LocalShare-Certificate-Info.txt,out/LocalShare-1.2-Windows-Setup-Signed.exe.sha256,out/1-TRUST-AND-INSTALL.cmd,out/README-FIRST.txt -DestinationPath out/LocalShare-1.2-Windows-Signed-Package.zip -Force

      - name: Verify local trust and installer launch
        shell: pwsh
        run: |
          $thumb=(Get-Content out/thumbprint.txt -Raw).Trim()
          Import-Certificate -FilePath out/LocalShare-Code-Signing.cer -CertStoreLocation 'Cert:\CurrentUser\Root' | Out-Null
          Import-Certificate -FilePath out/LocalShare-Code-Signing.cer -CertStoreLocation 'Cert:\CurrentUser\TrustedPublisher' | Out-Null
          if (-not (Test-Path "Cert:\CurrentUser\Root\$thumb")) { throw 'Root trust install failed' }
          if (-not (Test-Path "Cert:\CurrentUser\TrustedPublisher\$thumb")) { throw 'Publisher trust install failed' }
          $setup=(Resolve-Path 'out/LocalShare-1.2-Windows-Setup-Signed.exe').Path
          $p=Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Signed installer failed: $($p.ExitCode)" }
          if (-not (Test-Path 'C:\Program Files\LocalShare\local_share.exe')) { throw 'Installed LocalShare missing' }
          $u=Start-Process 'C:\Program Files\LocalShare\unins000.exe' -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw 'Uninstall failed' }

      - uses: actions/upload-artifact@v4
        with:
          name: LocalShare-1.2-Windows-Signed-Delivery
          path: |
            out/LocalShare-1.2-Windows-Setup-Signed.exe
            out/LocalShare-Code-Signing.cer
            out/LocalShare-Certificate-Info.txt
            out/LocalShare-1.2-Windows-Setup-Signed.exe.sha256
            out/1-TRUST-AND-INSTALL.cmd
            out/README-FIRST.txt
            out/LocalShare-1.2-Windows-Signed-Package.zip
          if-no-files-found: error
