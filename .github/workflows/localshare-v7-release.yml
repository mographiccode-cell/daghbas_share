name: LocalShare 1.4 Background Sharing Release

on:
  push:
    branches: [localshare-background-share-v7]

permissions:
  contents: write
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: localshare-background-share-v7
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply v7 integration and validate source
        shell: bash
        run: |
          python flutter_local_share/tools/apply_background_share_v7.py
          python flutter_local_share/tools/cleanup_background_share_v7.py
          cd flutter_local_share
          flutter pub get
          dart format lib test
          flutter analyze --fatal-warnings --no-fatal-infos
          flutter test
      - name: Commit validated source if changed
        shell: bash
        run: |
          git status --short
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard flutter_local_share/pubspec.lock)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter_local_share/lib flutter_local_share/overrides flutter_local_share/pubspec.yaml flutter_local_share/pubspec.lock flutter_local_share/test
          git commit -m "feat(localshare): finalize 1.4 background sharing integration"
          git push origin HEAD:localshare-background-share-v7

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: localshare-background-share-v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Android APK with background messaging and Share Sheet
        shell: bash
        run: |
          rm -rf generated
          flutter create --org com.mographiccode --project-name local_share --platforms=android generated
          rm -rf generated/lib generated/test
          cp -r flutter_local_share/lib generated/lib
          cp -r flutter_local_share/test generated/test
          cp flutter_local_share/pubspec.yaml generated/pubspec.yaml
          cp flutter_local_share/overrides/AndroidManifest.xml generated/android/app/src/main/AndroidManifest.xml
          cp flutter_local_share/overrides/MainActivity.kt generated/android/app/src/main/kotlin/com/mographiccode/local_share/MainActivity.kt
          python - <<'PY'
          from pathlib import Path
          p=Path('generated/android/app/build.gradle.kts')
          s=p.read_text(encoding='utf-8')
          s=s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 29')
          if 'isCoreLibraryDesugaringEnabled = true' not in s:
              s=s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' not in s:
              s += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
          p.write_text(s,encoding='utf-8')
          PY
          python -m pip install --quiet pillow
          python flutter_local_share/tools/generate_localshare_icon.py localshare_icon.png
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Image.open('localshare_icon.png').convert('RGBA')
          for dpi,size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              p=Path(f'generated/android/app/src/main/res/mipmap-{dpi}/ic_launcher.png')
              p.parent.mkdir(parents=True,exist_ok=True)
              src.resize((size,size),Image.Resampling.LANCZOS).save(p)
          PY
          grep -q 'FOREGROUND_SERVICE_REMOTE_MESSAGING' generated/android/app/src/main/AndroidManifest.xml
          grep -q 'android.intent.action.SEND_MULTIPLE' generated/android/app/src/main/AndroidManifest.xml
          grep -q 'remoteMessaging|connectedDevice' generated/android/app/src/main/AndroidManifest.xml
          cd generated
          flutter pub get
          flutter analyze --fatal-warnings --no-fatal-infos
          flutter test
          flutter build apk --release
          unzip -t build/app/outputs/flutter-apk/app-release.apk >/dev/null
          cp build/app/outputs/flutter-apk/app-release.apk ../LocalShare-1.4-Android.apk
          cd ..
          sha256sum LocalShare-1.4-Android.apk > LocalShare-1.4-Android.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: LocalShare-1.4-Android-BackgroundShare
          path: |
            LocalShare-1.4-Android.apk
            LocalShare-1.4-Android.apk.sha256

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: localshare-background-share-v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate, test and build Windows app
        shell: pwsh
        run: |
          if (Test-Path generated) { Remove-Item generated -Recurse -Force }
          flutter create --org com.mographiccode --project-name local_share --platforms=windows generated
          Remove-Item generated/lib -Recurse -Force
          Remove-Item generated/test -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item flutter_local_share/lib generated/lib -Recurse
          Copy-Item flutter_local_share/test generated/test -Recurse
          Copy-Item flutter_local_share/pubspec.yaml generated/pubspec.yaml -Force
          python flutter_local_share/tools/patch_windows_temp_cleanup.py generated/windows/runner/main.cpp
          python -m pip install --quiet pillow
          python flutter_local_share/tools/generate_localshare_icon.py localshare_icon.png
          @'
          from PIL import Image
          from pathlib import Path
          src=Image.open('localshare_icon.png').convert('RGBA')
          src.save(Path('generated/windows/runner/resources/app_icon.ico'),sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content icon_build.py -Encoding UTF8
          python icon_build.py
          Push-Location generated
          flutter pub get
          flutter analyze --fatal-warnings --no-fatal-infos
          flutter test
          flutter build windows --release
          Pop-Location
      - name: Create local LocalShare code-signing certificate and sign app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=MographicCode LocalShare' -KeyAlgorithm RSA -KeyLength 3072 -HashAlgorithm SHA256 -CertStoreLocation 'Cert:\CurrentUser\My' -NotAfter (Get-Date).AddYears(3)
          Export-Certificate -Cert $cert -FilePath artifacts/LocalShare-Code-Signing.cer | Out-Null
          Import-Certificate -FilePath artifacts/LocalShare-Code-Signing.cer -CertStoreLocation 'Cert:\CurrentUser\Root' | Out-Null
          Import-Certificate -FilePath artifacts/LocalShare-Code-Signing.cer -CertStoreLocation 'Cert:\CurrentUser\TrustedPublisher' | Out-Null
          $app=(Resolve-Path 'generated/build/windows/x64/runner/Release/local_share.exe').Path
          $signed=Set-AuthenticodeSignature -FilePath $app -Certificate $cert -HashAlgorithm SHA256
          if ($signed.Status -ne 'Valid') { throw "App signing failed: $($signed.Status)" }
          $cert.Thumbprint | Set-Content artifacts/LocalShare-Code-Signing.thumbprint.txt
      - name: Verify Windows close-to-tray background behavior
        shell: pwsh
        run: |
          $app=(Resolve-Path 'generated/build/windows/x64/runner/Release/local_share.exe').Path
          $p=Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 5
          $p.Refresh()
          if ($p.HasExited) { throw 'LocalShare exited during startup' }
          [void]$p.CloseMainWindow()
          Start-Sleep -Seconds 3
          $p.Refresh()
          if ($p.HasExited) { throw 'Closing the window terminated LocalShare instead of keeping it in the tray' }
          Stop-Process -Id $p.Id -Force
      - name: Build and sign Windows installer
        shell: pwsh
        run: |
          $release=(Resolve-Path 'generated/build/windows/x64/runner/Release').Path
          $icon=(Resolve-Path 'generated/windows/runner/resources/app_icon.ico').Path
          $iss=@"
          [Setup]
          AppId={{8D2D488C-246B-4BDC-8C24-7B10A65B9649}
          AppName=LocalShare
          AppVersion=1.4.0
          AppPublisher=MographicCode LocalShare
          DefaultDirName={autopf}\LocalShare
          DefaultGroupName=LocalShare
          OutputDir=$($PWD.Path)\artifacts
          OutputBaseFilename=LocalShare-1.4-Windows-Setup-Signed
          SetupIconFile=$icon
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=admin
          UninstallDisplayIcon={app}\local_share.exe
          [Files]
          Source: "$release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{autoprograms}\LocalShare"; Filename: "{app}\local_share.exe"; WorkingDir: "{app}"; IconFilename: "{app}\local_share.exe"
          Name: "{autodesktop}\LocalShare"; Filename: "{app}\local_share.exe"; WorkingDir: "{app}"; IconFilename: "{app}\local_share.exe"
          [Run]
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall add rule name=""LocalShare TCP"" dir=in action=allow protocol=TCP localport=40404 profile=private"; Flags: runhidden
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall add rule name=""LocalShare UDP Discovery"" dir=in action=allow protocol=UDP localport=40405 profile=private"; Flags: runhidden
          [UninstallRun]
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall delete rule name=""LocalShare TCP"""; Flags: runhidden; RunOnceId: "RemoveLocalShareTcp"
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall delete rule name=""LocalShare UDP Discovery"""; Flags: runhidden; RunOnceId: "RemoveLocalShareUdp"
          "@
          Set-Content installer.iss $iss -Encoding UTF8
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cert=Get-ChildItem 'Cert:\CurrentUser\My' | Where-Object Subject -eq 'CN=MographicCode LocalShare' | Sort-Object NotBefore -Descending | Select-Object -First 1
          $setup=(Resolve-Path 'artifacts/LocalShare-1.4-Windows-Setup-Signed.exe').Path
          $signed=Set-AuthenticodeSignature -FilePath $setup -Certificate $cert -HashAlgorithm SHA256
          if ($signed.Status -ne 'Valid') { throw "Installer signing failed: $($signed.Status)" }
          $verify=Get-AuthenticodeSignature $setup
          if ($verify.Status -ne 'Valid') { throw "Installer verification failed: $($verify.Status)" }
          Get-FileHash $setup -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  LocalShare-1.4-Windows-Setup-Signed.exe" } | Set-Content artifacts/LocalShare-1.4-Windows-Setup-Signed.exe.sha256
          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          echo Installing the LocalShare publisher certificate...
          certutil -addstore -f Root "LocalShare-Code-Signing.cer" || exit /b 1
          certutil -addstore -f TrustedPublisher "LocalShare-Code-Signing.cer" || exit /b 1
          echo Starting signed LocalShare setup...
          start "" "LocalShare-1.4-Windows-Setup-Signed.exe"
          '@ | Set-Content artifacts/1-TRUST-AND-INSTALL-LOCALSHARE.cmd -Encoding ASCII
          Compress-Archive -Path artifacts/LocalShare-1.4-Windows-Setup-Signed.exe,artifacts/LocalShare-Code-Signing.cer,artifacts/LocalShare-Code-Signing.thumbprint.txt,artifacts/1-TRUST-AND-INSTALL-LOCALSHARE.cmd,artifacts/LocalShare-1.4-Windows-Setup-Signed.exe.sha256 -DestinationPath artifacts/LocalShare-1.4-Windows-Signed-Package.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: LocalShare-1.4-Windows-BackgroundShare-Signed
          path: |
            artifacts/LocalShare-1.4-Windows-Setup-Signed.exe
            artifacts/LocalShare-1.4-Windows-Setup-Signed.exe.sha256
            artifacts/LocalShare-Code-Signing.cer
            artifacts/LocalShare-Code-Signing.thumbprint.txt
            artifacts/1-TRUST-AND-INSTALL-LOCALSHARE.cmd
            artifacts/LocalShare-1.4-Windows-Signed-Package.zip
