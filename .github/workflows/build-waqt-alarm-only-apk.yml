name: Build WAQT Alarm Only APK

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout alarm-only branch
        uses: actions/checkout@v4
        with:
          ref: waqt-alarm-only-build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Build and verify Samsung-style alarm APK
        shell: bash
        run: |
          rm -rf app source ci-output-alarm-only waqt_v12.b64 waqt_v12.zip
          mkdir -p ci-output-alarm-only
          set +e
          (
            set -e
            echo '=== SOURCE ==='
            cat \
              ci/v12/waqt_source.b64.00 ci/v12/waqt_source.b64.01 \
              ci/v12/waqt_source.b64.02 ci/v12/waqt_source.b64.03 \
              ci/v12/waqt_source.b64.04 ci/v12/waqt_source.b64.05a \
              ci/v12/waqt_source.b64.05b ci/v12/waqt_source.b64.06 \
              ci/v12/waqt_source.b64.07 ci/v12/waqt_source.b64.08 \
              ci/v12/waqt_source.b64.09 ci/v12/waqt_source.b64.10 \
              ci/v12/waqt_source.b64.11 > waqt_v12.b64
            test "$(wc -c < waqt_v12.b64)" -eq 107496
            base64 --decode waqt_v12.b64 > waqt_v12.zip
            echo '625ac5c43a0ccaa697364ec5de04892dc426466037730a99f76985406e31d762  waqt_v12.zip' | sha256sum --check
            mkdir source
            unzip -q waqt_v12.zip -d source

            echo '=== RINGTONES ==='
            python3 - <<'PY'
          import math, wave, struct
          from pathlib import Path
          sr=44100
          raw=Path('source/waqt_alarm/android/app/src/main/res/raw'); raw.mkdir(parents=True, exist_ok=True)
          def write(name,duration,freq,amp=.35):
              n=int(sr*duration)
              with wave.open(str(raw/f'{name}.wav'),'w') as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
                  frames=bytearray()
                  for i in range(n):
                      t=i/sr; gate=1 if (t%0.7)<0.42 else 0
                      frames += struct.pack('<h', int(math.sin(2*math.pi*freq*t)*gate*amp*32767))
                  w.writeframes(frames)
          write('waqt_classic',4.0,880)
          write('waqt_soft',4.0,523.25,.22)
          write('waqt_digital',3.2,1100,.32)
          PY

            echo '=== SCAFFOLD ==='
            mkdir app
            cd app
            flutter create --platforms=android --org com.waqt --project-name waqt_alarm .
            cd ..
            cp -R source/waqt_alarm/lib app/
            rm -rf app/test
            cp -R source/waqt_alarm/test app/test
            cp source/waqt_alarm/pubspec.yaml app/pubspec.yaml
            cp source/waqt_alarm/analysis_options.yaml app/analysis_options.yaml
            cp source/waqt_alarm/android/app/src/main/AndroidManifest.xml app/android/app/src/main/AndroidManifest.xml
            rm -rf app/android/app/src/main/kotlin
            mkdir -p app/android/app/src/main/kotlin/com/waqt/alarm
            cp ci/MainActivity.kt app/android/app/src/main/kotlin/com/waqt/alarm/MainActivity.kt
            mkdir -p app/android/app/src/main/res/drawable app/android/app/src/main/res/raw app/android/app/src/main/res/values app/android/app/src/main/res/values-night
            cp source/waqt_alarm/android/app/src/main/res/drawable/ic_stat_alarm.xml app/android/app/src/main/res/drawable/
            cp source/waqt_alarm/android/app/src/main/res/raw/* app/android/app/src/main/res/raw/
            cp source/waqt_alarm/android/app/src/main/res/values/styles.xml app/android/app/src/main/res/values/styles.xml
            cp source/waqt_alarm/android/app/src/main/res/values/colors.xml app/android/app/src/main/res/values/colors.xml
            cp source/waqt_alarm/android/app/src/main/res/values-night/styles.xml app/android/app/src/main/res/values-night/styles.xml

            echo '=== ALARM ONLY + ONE UI OVERRIDES ==='
            cp ci/alarm-only/app.dart app/lib/app.dart
            cp ci/alarm-only/alarms_screen.dart app/lib/screens/alarms/alarms_screen.dart
            cp ci/alarm-only/alarm_editor_screen.dart app/lib/screens/alarms/alarm_editor_screen.dart
            cp ci/alarm-only/alarm_ring_screen.dart app/lib/screens/alarm_ring_screen.dart
            python3 ci/alarm-only/apply_alarm_only.py
            rm -rf app/lib/screens/medications app/lib/screens/tasks app/lib/screens/home
            rm -f app/lib/screens/shell_screen.dart

            cp ci/alarm-only/waqt_build.gradle.kts app/android/app/build.gradle.kts
            base64 --decode ci/alarm-only/waqt-release.jks.b64 > app/android/app/waqt-release.jks
            rm -rf app/android/app/src/main/res/mipmap-*
            base64 --decode ci/alarm-only/ic_launcher.png.b64 > /tmp/ic_launcher.png
            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p "app/android/app/src/main/res/mipmap-$density"
              cp /tmp/ic_launcher.png "app/android/app/src/main/res/mipmap-$density/ic_launcher.png"
            done

            echo '=== VERIFY SCOPE ==='
            grep -q 'applicationId = "com.waqt.alarm"' app/android/app/build.gradle.kts
            grep -q "home: const Directionality" app/lib/app.dart
            ! grep -q 'MedicationEditorScreen' app/lib/app.dart
            ! grep -q 'TaskEditorScreen' app/lib/app.dart
            ! test -d app/lib/screens/medications
            ! test -d app/lib/screens/tasks

            cd app
            flutter pub get
            echo '=== ANALYZE ==='
            flutter analyze --no-fatal-infos
            echo '=== TEST ==='
            flutter test
            echo '=== BUILD ==='
            flutter build apk --release --build-name=3.0.0 --build-number=5
            cd ..

            cp app/build/app/outputs/flutter-apk/app-release.apk ci-output-alarm-only/WAQT-Alarm-Samsung-Style-v3.0.apk
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
            "$APKSIGNER" verify --verbose --print-certs ci-output-alarm-only/WAQT-Alarm-Samsung-Style-v3.0.apk | tee ci-output-alarm-only/signature.txt
            sha256sum ci-output-alarm-only/WAQT-Alarm-Samsung-Style-v3.0.apk | tee ci-output-alarm-only/WAQT-Alarm-Samsung-Style-v3.0.apk.sha256
            keytool -list -v -keystore app/android/app/waqt-release.jks -storepass waqt2026 -alias waqt | grep 'SHA256:' | tee ci-output-alarm-only/signing-cert.txt
            ls -lh ci-output-alarm-only/WAQT-Alarm-Samsung-Style-v3.0.apk
            echo SUCCESS > ci-output-alarm-only/status.txt
          ) 2>&1 | tee ci-output-alarm-only/build.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then echo "FAILED:$result" > ci-output-alarm-only/status.txt; fi
          echo "pipeline_exit=$result" >> ci-output-alarm-only/status.txt
          exit "$result"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WAQT-Alarm-Samsung-Style-APK
          path: |
            ci-output-alarm-only/WAQT-Alarm-Samsung-Style-v3.0.apk
            ci-output-alarm-only/WAQT-Alarm-Samsung-Style-v3.0.apk.sha256
            ci-output-alarm-only/signature.txt
          compression-level: 0
          retention-days: 30

      - name: Publish output
        if: always()
        shell: bash
        run: |
          mkdir -p ci-output-alarm-only
          if [ ! -f ci-output-alarm-only/status.txt ]; then echo 'FAILED:setup-or-runner' > ci-output-alarm-only/status.txt; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f ci-output-alarm-only
          git commit -m 'ci: WAQT Samsung-style alarm APK [skip ci]' || exit 0
          git pull --rebase origin waqt-alarm-only-build || { git rebase --abort || true; echo 'Publish skipped due concurrent branch update'; exit 0; }
          git push origin HEAD:waqt-alarm-only-build || echo 'Publish skipped due concurrent branch update'
