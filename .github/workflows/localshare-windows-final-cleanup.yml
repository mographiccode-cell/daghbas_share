name: LocalShare Windows Final Cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  windows:
    name: Windows final installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: localshare-chat-v3

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows project and apply exit cleanup
        shell: pwsh
        run: |
          if (Test-Path generated) { Remove-Item generated -Recurse -Force }
          flutter config --enable-windows-desktop
          flutter create --org com.mographiccode --project-name local_share --platforms=windows generated
          Remove-Item generated/lib -Recurse -Force
          Remove-Item generated/test -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item flutter_local_share/lib generated/lib -Recurse
          Copy-Item flutter_local_share/test generated/test -Recurse
          Copy-Item flutter_local_share/pubspec.yaml generated/pubspec.yaml -Force
          python flutter_local_share/tools/patch_windows_temp_cleanup.py generated/windows/runner/main.cpp
          Select-String -Path generated/windows/runner/main.cpp -Pattern 'synchronously remove temporary received files' | Out-Null

      - name: Generate LocalShare icon
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          python flutter_local_share/tools/generate_localshare_icon.py localshare_icon.png
          @'
          from PIL import Image
          from pathlib import Path
          src=Image.open('localshare_icon.png').convert('RGBA')
          out=Path('generated/windows/runner/resources/app_icon.ico')
          src.save(out,sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content icon_build.py -Encoding UTF8
          python icon_build.py

      - name: Analyze test and build
        working-directory: generated
        shell: pwsh
        run: |
          flutter pub get
          dart format lib test
          flutter analyze --fatal-warnings --no-fatal-infos
          flutter test
          flutter build windows --release

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $release=(Resolve-Path 'generated/build/windows/x64/runner/Release').Path
          $setupIcon=(Resolve-Path 'generated/windows/runner/resources/app_icon.ico').Path
          $iss=@"
          [Setup]
          AppId={{8D2D488C-246B-4BDC-8C24-7B10A65B9649}
          AppName=LocalShare
          AppVersion=1.2.0
          AppPublisher=MographicCode
          DefaultDirName={autopf}\LocalShare
          DefaultGroupName=LocalShare
          OutputDir=$($PWD.Path)\artifacts
          OutputBaseFilename=LocalShare-Windows-Setup
          SetupIconFile=$setupIcon
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=admin
          UninstallDisplayIcon={app}\local_share.exe

          [Files]
          Source: "$release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\LocalShare"; Filename: "{app}\local_share.exe"; WorkingDir: "{app}"; IconFilename: "{app}\local_share.exe"
          Name: "{autodesktop}\LocalShare"; Filename: "{app}\local_share.exe"; WorkingDir: "{app}"; IconFilename: "{app}\local_share.exe"

          [Run]
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall add rule name=""LocalShare TCP"" dir=in action=allow protocol=TCP localport=40404 profile=private"; Flags: runhidden
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall add rule name=""LocalShare UDP Discovery"" dir=in action=allow protocol=UDP localport=40405 profile=private"; Flags: runhidden

          [UninstallRun]
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall delete rule name=""LocalShare TCP"""; Flags: runhidden; RunOnceId: "RemoveLocalShareTcp"
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall delete rule name=""LocalShare UDP Discovery"""; Flags: runhidden; RunOnceId: "RemoveLocalShareUdp"
          "@
          Set-Content installer.iss $iss -Encoding UTF8
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash artifacts/LocalShare-Windows-Setup.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  LocalShare-Windows-Setup.exe" } | Set-Content artifacts/LocalShare-Windows-Setup.exe.sha256

      - name: Verify normal close deletes temp immediately and crash cleanup survives
        shell: pwsh
        run: |
          $setup=(Resolve-Path 'artifacts/LocalShare-Windows-Setup.exe').Path
          $install=Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Install failed' }
          $exe='C:\Program Files\LocalShare\local_share.exe'
          $desktopCandidates=@("$env:PUBLIC\Desktop\LocalShare.lnk","$env:USERPROFILE\Desktop\LocalShare.lnk")
          $shortcut=$desktopCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $shortcut) { throw 'Desktop shortcut missing' }

          $p=Start-Process $exe -PassThru
          Start-Sleep 8
          if ($p.HasExited) { throw 'App failed first launch' }
          $session=Get-ChildItem "$env:TEMP\LocalShare" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $session) { throw 'Session temp directory missing' }
          $normalTemp=Join-Path $session.FullName 'normal-close.tmp'
          Set-Content $normalTemp 'delete synchronously on window close'
          if (-not $p.CloseMainWindow()) { throw 'Could not request normal window close' }
          if (-not $p.WaitForExit(15000)) { throw 'App did not exit after normal close' }
          Start-Sleep 1
          if (Test-Path $normalTemp) { throw 'Normal-close temp file remained after app exit' }
          if (Test-Path "$env:TEMP\LocalShare") {
            $left=Get-ChildItem "$env:TEMP\LocalShare" -Recurse -File -ErrorAction SilentlyContinue
            if ($left) { throw 'Temporary files remained after normal close' }
          }

          $p2=Start-Process $exe -PassThru
          Start-Sleep 6
          $session2=Get-ChildItem "$env:TEMP\LocalShare" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $session2) { throw 'Second session temp directory missing' }
          Set-Content (Join-Path $session2.FullName 'crash-leftover.tmp') 'delete on next launch'
          Stop-Process -Id $p2.Id -Force
          Start-Sleep 1
          $p3=Start-Process $exe -PassThru
          Start-Sleep 6
          if (Get-ChildItem "$env:TEMP\LocalShare" -Recurse -File -Filter 'crash-leftover.tmp' -ErrorAction SilentlyContinue) { throw 'Crash leftover not removed on restart' }
          if (-not $p3.CloseMainWindow()) { throw 'Could not close third launch' }
          if (-not $p3.WaitForExit(15000)) { throw 'Third launch did not exit' }

          if (-not (Get-NetFirewallRule -DisplayName 'LocalShare TCP' -ErrorAction SilentlyContinue)) { throw 'TCP firewall rule missing' }
          if (-not (Get-NetFirewallRule -DisplayName 'LocalShare UDP Discovery' -ErrorAction SilentlyContinue)) { throw 'UDP firewall rule missing' }

          $uninstaller='C:\Program Files\LocalShare\unins000.exe'
          $uninstall=Start-Process $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstall failed' }
          if ($desktopCandidates | Where-Object { Test-Path $_ }) { throw 'Desktop shortcut remained' }

      - uses: actions/upload-artifact@v4
        with:
          name: LocalShare-Windows-Final-StrictCleanup
          path: |
            artifacts/LocalShare-Windows-Setup.exe
            artifacts/LocalShare-Windows-Setup.exe.sha256
          if-no-files-found: error
