name: LocalShare 1.4.1 Android Delivery

on:
  push:
    branches: [localshare-1.4.1-delivery]

concurrency:
  group: localshare-141-android-final
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf generated
          flutter create --org com.mographiccode --project-name local_share --platforms=android generated
          rm -rf generated/lib generated/test
          cp -r flutter_local_share/lib generated/lib
          cp -r flutter_local_share/test generated/test
          cp flutter_local_share/pubspec.yaml generated/pubspec.yaml
          cp flutter_local_share/overrides/AndroidManifest.xml generated/android/app/src/main/AndroidManifest.xml
          mkdir -p generated/android/app/src/main/kotlin/com/mographiccode/local_share
          cp flutter_local_share/overrides/MainActivity.kt generated/android/app/src/main/kotlin/com/mographiccode/local_share/MainActivity.kt
          python - <<'PY'
          from pathlib import Path
          p=Path('generated/android/app/build.gradle.kts')
          s=p.read_text()
          s=s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 29')
          if 'isCoreLibraryDesugaringEnabled = true' not in s:
              s=s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' not in s:
              s += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
          p.write_text(s)
          PY
          grep -q '^version: 1.4.1+8$' generated/pubspec.yaml
          grep -q 'FOREGROUND_SERVICE_CONNECTED_DEVICE' generated/android/app/src/main/AndroidManifest.xml
          grep -q 'POST_NOTIFICATIONS' generated/android/app/src/main/AndroidManifest.xml
          grep -q 'CHANGE_WIFI_MULTICAST_STATE' generated/android/app/src/main/AndroidManifest.xml
          grep -q 'CHANGE_WIFI_STATE' generated/android/app/src/main/AndroidManifest.xml
          grep -q 'LocalShareForegroundService' generated/android/app/src/main/AndroidManifest.xml
          grep -q 'android.intent.action.SEND_MULTIPLE' generated/android/app/src/main/AndroidManifest.xml

      - name: Fix analyze test and build
        shell: bash
        run: |
          set -euo pipefail
          cd generated
          flutter pub get
          dart fix --apply
          dart format lib test
          flutter analyze --fatal-infos
          flutter test
          flutter build apk --release
          unzip -t build/app/outputs/flutter-apk/app-release.apk >/dev/null
          cd ..
          cp generated/build/app/outputs/flutter-apk/app-release.apk LocalShare-1.4.1-Android.apk
          sha256sum LocalShare-1.4.1-Android.apk > LocalShare-1.4.1-Android.apk.sha256

      - name: Emulator launch and native background smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            adb install -r LocalShare-1.4.1-Android.apk
            adb shell pm grant com.mographiccode.local_share android.permission.POST_NOTIFICATIONS || true
            adb shell am start -n com.mographiccode.local_share/.MainActivity
            sleep 12
            adb shell pidof com.mographiccode.local_share
            adb shell dumpsys activity services com.mographiccode.local_share | grep -q LocalShareForegroundService
            adb shell input keyevent KEYCODE_HOME
            sleep 8
            adb shell pidof com.mographiccode.local_share
            adb shell dumpsys activity services com.mographiccode.local_share | grep -q LocalShareForegroundService
            adb shell am force-stop com.mographiccode.local_share

      - name: Package exact Android Flutter source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source-package
          cp -a generated source-package
          rm -rf source-package/build source-package/.dart_tool
          find source-package -type d -name .gradle -prune -exec rm -rf {} + || true
          find source-package -type d -name build -prune -exec rm -rf {} + || true
          printf '%s\n' \
            'LocalShare 1.4.1+8' \
            'Package: com.mographiccode.local_share' \
            'Android minSdk: 29' \
            'Validated on Android 16 / API 36 emulator' \
            'Native foreground keepalive: LocalShareForegroundService' \
            'Build: flutter pub get && flutter test && flutter build apk --release' \
            > source-package/LOCALSHARE_BUILD_INFO.txt
          zip -qr LocalShare-1.4.1-Android-Source.zip source-package
          unzip -t LocalShare-1.4.1-Android-Source.zip >/dev/null
          sha256sum LocalShare-1.4.1-Android-Source.zip > LocalShare-1.4.1-Android-Source.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: LocalShare-1.4.1-Android-Final
          if-no-files-found: error
          path: |
            LocalShare-1.4.1-Android.apk
            LocalShare-1.4.1-Android.apk.sha256
            LocalShare-1.4.1-Android-Source.zip
            LocalShare-1.4.1-Android-Source.zip.sha256
