name: Mustanadati v2.7 corrected source export
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  export-source:
    if: github.head_ref == 'docviewer-apk-build-20260821'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Reconstruct v2.7
        run: |
          set -euo pipefail
          mkdir -p docviewer_build
          cat docviewer_apk_payload/part*.b64 | base64 -d > /tmp/docviewer.tar.gz
          tar -xzf /tmp/docviewer.tar.gz -C docviewer_build
          touch docviewer_build/README.md
          cp docviewer_apk_payload/patch/pubspec.yaml docviewer_build/pubspec.yaml
          cp docviewer_apk_payload/patch/document_item.dart docviewer_build/lib/models/document_item.dart
          cp docviewer_apk_payload/patch/viewer_screen.dart docviewer_build/lib/screens/viewer_screen.dart
          cp docviewer_apk_payload/patch/home_screen.dart docviewer_build/lib/screens/home_screen.dart
          cp docviewer_apk_payload/patch/document_tile.dart docviewer_build/lib/widgets/document_tile.dart
          cp docviewer_apk_payload/patch/main.dart docviewer_build/lib/main.dart
          cp docviewer_apk_payload/patch/reading_progress_service.dart docviewer_build/lib/services/reading_progress_service.dart
          cp docviewer_apk_payload/patch/v27_patch.py docviewer_build/tool/v27_patch.py
          sed -i '/allowMultiple: true,/d' docviewer_build/lib/services/file_service.dart
          sed -i 's/separatorBuilder: (_, __)/separatorBuilder: (_, _)/g' docviewer_build/lib/screens/viewer_screen.dart
          rm -f docviewer_build/lib/services/document_viewer_service.dart
          cd docviewer_build
          python3 tool/v27_patch.py

      - name: Bootstrap Android
        working-directory: docviewer_build
        run: bash tool/bootstrap_android.sh

      - name: Add final Android resources and config
        working-directory: docviewer_build
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/mipmap-anydpi-v33 android/app/src/main/res/values
          cp ../docviewer_apk_payload/patch/ic_launcher_foreground.xml android/app/src/main/res/drawable/ic_launcher_foreground.xml
          cp ../docviewer_apk_payload/patch/ic_launcher_monochrome.xml android/app/src/main/res/drawable/ic_launcher_monochrome.xml
          cp ../docviewer_apk_payload/patch/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp ../docviewer_apk_payload/patch/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          cp ../docviewer_apk_payload/patch/ic_launcher_v33.xml android/app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml
          cp ../docviewer_apk_payload/patch/ic_launcher_v33.xml android/app/src/main/res/mipmap-anydpi-v33/ic_launcher_round.xml
          cp ../docviewer_apk_payload/patch/colors.xml android/app/src/main/res/values/ic_launcher_colors.xml
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/build.gradle.kts')
          s=p.read_text()
          s=re.sub(r'(?m)^(\s*)compileSdk\s*=.*$', r'\1compileSdk = 37', s)
          s=re.sub(r'(?m)^(\s*)minSdk\s*=.*$', r'\1minSdk = 26', s)
          s=re.sub(r'(?m)^(\s*)applicationId\s*=.*$', r'\1applicationId = "com.mographiccode.mustanadati.app"', s)
          marker='        targetCompatibility = JavaVersion.VERSION_17\n'
          if 'isCoreLibraryDesugaringEnabled = true' not in s:
              s=s.replace(marker, marker+'        isCoreLibraryDesugaringEnabled = true\n')
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' not in s:
              s+='\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
          p.write_text(s)
          m=Path('android/app/src/main/AndroidManifest.xml')
          manifest=m.read_text()
          if 'xmlns:tools=' not in manifest:
              manifest=manifest.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android"','<manifest xmlns:android="http://schemas.android.com/apk/res/android"\n    xmlns:tools="http://schemas.android.com/tools"')
          for permission in ['android.permission.READ_MEDIA_IMAGES','android.permission.READ_MEDIA_VIDEO','android.permission.READ_MEDIA_AUDIO']:
              node=f'    <uses-permission android:name="{permission}" tools:node="remove" />\n'
              if node.strip() not in manifest:
                  manifest=manifest.replace('<application', node+'<application', 1)
          if 'android:roundIcon=' not in manifest:
              manifest=manifest.replace('android:icon="@mipmap/ic_launcher"\n','android:icon="@mipmap/ic_launcher"\n        android:roundIcon="@mipmap/ic_launcher_round"\n')
          m.write_text(manifest)
          PY

      - name: Add local dependency preparation script
        working-directory: docviewer_build
        run: |
          cat > tool/prepare_local_build.py <<'PY'
          from pathlib import Path
          import os
          import subprocess

          subprocess.run(['flutter', 'pub', 'get'], check=True)
          pub_cache = Path(os.environ.get('PUB_CACHE', Path.home() / '.pub-cache'))

          docx = pub_cache / 'hosted' / 'pub.dev' / 'docx_file_viewer-1.0.3' / 'lib' / 'src' / 'docx_view.dart'
          s = docx.read_text()
          if 'final ScrollController? scrollController;' not in s:
              s = s.replace('  final DocxSearchController? searchController;\n','  final DocxSearchController? searchController;\n\n  final ScrollController? scrollController;\n',1)
          if '    this.scrollController,\n' not in s:
              s = s.replace('    this.searchController,\n    this.onLoaded,\n','    this.searchController,\n    this.scrollController,\n    this.onLoaded,\n',1)
          if 'controller: widget.scrollController,' not in s:
              s = s.replace('    final list = SingleChildScrollView(\n      padding: widget.config.padding,\n','    final list = SingleChildScrollView(\n      controller: widget.scrollController,\n      padding: widget.config.padding,\n',1)
          docx.write_text(s)

          plugin_dir = pub_cache / 'hosted' / 'pub.dev' / 'doc_viewer-0.0.3'
          for f in plugin_dir.rglob('*'):
              if not f.is_file():
                  continue
              try:
                  text = f.read_text()
              except Exception:
                  continue
              old='com.github.barteksc:android-pdf-viewer:2.8.2'
              if old in text:
                  f.write_text(text.replace(old,'com.github.mhiew:android-pdf-viewer:3.2.0-beta.3'))
          print('Dependencies prepared successfully.')
          PY

          cat > FINAL_SOURCE_README.md <<'EOF'
          # مستنداتي v2.7.0 — Final Source Code

          ## Included
          - Light theme only (Dark theme intentionally removed).
          - Rename any supported file and keep its extension.
          - Duplicate/copy file.
          - Delete file with confirmation.
          - Favorites, Pin, Read Later.
          - List/Grid modes, sorting and filters.
          - Recent files and Continue Reading.
          - PDF resume from last page + page status.
          - Word DOCX paged/reading modes, search, zoom, selection and resume position.
          - XLSX safe internal viewer, sheet tabs, frozen headers and in-sheet search.
          - PowerPoint embedded viewer.
          - Adaptive Android icon + monochrome themed icon.
          - Local-first privacy.

          ## Environment
          Flutter 3.44.7 stable
          Java 17
          Android compileSdk 37
          Android minSdk 26
          Package ID: com.mographiccode.mustanadati.app
          Version: 2.7.0+9

          ## First setup
          Run once after `flutter pub get`:

              python tool/prepare_local_build.py

          Then:

              flutter analyze
              flutter run

          Release ARM64 APK:

              flutter build apk --release --target-platform android-arm64 --split-per-abi
          EOF

      - name: Prepare dependencies and verify final source
        working-directory: docviewer_build
        run: |
          python3 tool/prepare_local_build.py
          rm -f test/widget_test.dart
          flutter analyze --fatal-infos
          grep -q 'version: 2.7.0+9' pubspec.yaml
          grep -q '_renameItem' lib/screens/home_screen.dart
          grep -q 'File(item.path).rename' lib/screens/home_screen.dart
          grep -q 'File(item.path).copy' lib/screens/home_screen.dart
          grep -q 'await file.delete' lib/screens/home_screen.dart
          grep -q 'ui.pinned_paths' lib/screens/home_screen.dart
          grep -q 'ThemeMode.light' lib/main.dart
          ! grep -q 'darkTheme:' lib/main.dart
          grep -q 'migratePath' lib/services/reading_progress_service.dart
          grep -q 'صفحة \$visiblePage' lib/screens/viewer_screen.dart
          grep -q 'بحث داخل الورقة' lib/screens/viewer_screen.dart

      - name: Create source archive
        run: |
          rm -rf docviewer_build/.dart_tool docviewer_build/build
          find docviewer_build -name '.flutter-plugins*' -delete
          mv docviewer_build Mustanadati-v2.7.0-Final-Source-Code
          zip -qr Mustanadati-v2.7.0-Final-Source-Code.zip Mustanadati-v2.7.0-Final-Source-Code
          sha256sum Mustanadati-v2.7.0-Final-Source-Code.zip > Mustanadati-v2.7.0-Final-Source-Code.zip.sha256
          ls -lh Mustanadati-v2.7.0-Final-Source-Code.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Mustanadati-v2.7.0-Final-Source-Code
          path: |
            Mustanadati-v2.7.0-Final-Source-Code.zip
            Mustanadati-v2.7.0-Final-Source-Code.zip.sha256
          if-no-files-found: error
          retention-days: 7
