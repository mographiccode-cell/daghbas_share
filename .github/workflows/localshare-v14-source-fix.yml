name: LocalShare 1.4 Source Validation

on:
  push:
    branches: [localshare-1.4-background-share]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: localshare-1.4-background-share
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply and verify source
        shell: bash
        run: |
          if ! grep -q "Future<void> shareFile(ChatMessage message)" flutter_local_share/lib/chat_local_share_service.dart; then
            python flutter_local_share/tools/apply_localshare_v14.py
            sed -i "s/throw const UnsupportedError(/throw UnsupportedError(/" flutter_local_share/lib/chat_local_share_service.dart
          fi
          cd flutter_local_share
          flutter pub get
          dart format lib test
          flutter analyze --fatal-warnings --no-fatal-infos
          flutter test
      - name: Commit source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter_local_share/lib flutter_local_share/pubspec.lock
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(localshare): finalize 1.4 background and sharing source"
          git push origin HEAD:localshare-1.4-background-share
