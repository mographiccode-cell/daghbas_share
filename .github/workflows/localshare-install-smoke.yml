name: LocalShare Android Install Smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  android-install:
    name: Android APK emulator smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact released Android artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p smoke/android
          gh run download 32579936031 -n LocalShare-Secure-Android -D smoke/android
          test -f smoke/android/LocalShare-Secure-Android.apk
          unzip -t smoke/android/LocalShare-Secure-Android.apk >/dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and verify Android runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r smoke/android/LocalShare-Secure-Android.apk
            adb shell pm path com.mographiccode.local_share
            adb logcat -c
            adb shell am start -W -n com.mographiccode.local_share/.MainActivity
            sleep 10
            test -n "$(adb shell pidof com.mographiccode.local_share | tr -d '\r')"
            adb shell dumpsys activity activities | grep -q 'ResumedActivity:.*com.mographiccode.local_share/.MainActivity'
            adb logcat -d -v threadtime > smoke/android/runtime-full.log
            test -z "$(grep -E 'FATAL EXCEPTION|AndroidRuntime: FATAL' smoke/android/runtime-full.log | head -n 1)"
            adb uninstall com.mographiccode.local_share
