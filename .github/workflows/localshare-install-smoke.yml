name: LocalShare Android Diagnostic Smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  android-install:
    name: Android APK emulator diagnostic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact released Android artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p smoke/android
          gh run download 32579936031 -n LocalShare-Secure-Android -D smoke/android
          test -f smoke/android/LocalShare-Secure-Android.apk
          unzip -t smoke/android/LocalShare-Secure-Android.apk >/dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch, and capture Android runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set +e
            adb install -r smoke/android/LocalShare-Secure-Android.apk
            INSTALL_RC=$?
            adb shell pm path com.mographiccode.local_share
            adb logcat -c
            adb shell am start -W -n com.mographiccode.local_share/.MainActivity
            START_RC=$?
            sleep 10
            PID=$(adb shell pidof com.mographiccode.local_share | tr -d '\r')
            adb shell dumpsys activity activities > smoke/android/activities.txt
            adb logcat -d -v threadtime > smoke/android/runtime-full.log
            echo "INSTALL_RC=$INSTALL_RC START_RC=$START_RC PID=$PID"
            echo '--- LocalShare log lines ---'
            grep -i -E 'local_share|LocalShare|com.mographiccode.local_share|AndroidRuntime|FATAL EXCEPTION|flutter' smoke/android/runtime-full.log | tail -n 300 || true
            echo '--- Activity lines ---'
            grep -i 'com.mographiccode.local_share' smoke/android/activities.txt | head -n 50 || true
            if [ "$INSTALL_RC" -ne 0 ] || [ "$START_RC" -ne 0 ] || [ -z "$PID" ]; then
              exit 1
            fi
            if grep -E 'FATAL EXCEPTION|AndroidRuntime: FATAL' smoke/android/runtime-full.log; then
              exit 1
            fi
            adb uninstall com.mographiccode.local_share
