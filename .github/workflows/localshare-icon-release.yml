name: LocalShare Icon Release

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  android:
    name: Android icon release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: localshare-icon-release
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        shell: bash
        run: |
          rm -rf generated
          flutter create --org com.mographiccode --project-name local_share --platforms=android generated
          rm -rf generated/lib generated/test
          cp -R flutter_local_share/lib generated/lib
          cp -R flutter_local_share/test generated/test
          cp flutter_local_share/pubspec.yaml generated/pubspec.yaml
          cp flutter_local_share/overrides/AndroidManifest.xml generated/android/app/src/main/AndroidManifest.xml
          cp flutter_local_share/overrides/MainActivity.kt generated/android/app/src/main/kotlin/com/mographiccode/local_share/MainActivity.kt
      - name: Apply verified LocalShare icon to Android
        shell: bash
        run: |
          echo '54d7090646e7c755c55a9c67d972d74f38fb51b3dc93448542725731a7427f8e  flutter_local_share/assets/localshare_icon.jpg' | sha256sum -c -
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src = Image.open('flutter_local_share/assets/localshare_icon.jpg').convert('RGBA')
          assert src.size == (128, 128)
          for folder, size in {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}.items():
              out = Path('generated/android/app/src/main/res') / folder / 'ic_launcher.png'
              out.parent.mkdir(parents=True, exist_ok=True)
              src.resize((size,size), Image.Resampling.LANCZOS).save(out, optimize=True)
          PY
          test -s generated/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Resolve dependencies
        working-directory: generated
        run: flutter pub get
      - name: OSV dependency vulnerability scan
        uses: google/osv-scanner-action/osv-scanner-action@06b2ab4348248b456ee06c9e953637f55e03504f
        with:
          scan-args: --lockfile=generated/pubspec.lock
      - name: Analyze and test
        working-directory: generated
        run: |
          dart format lib test
          flutter analyze --fatal-warnings --no-fatal-infos
          flutter test
      - name: Build Android release
        working-directory: generated
        run: flutter build apk --release
      - name: Verify Android APK
        shell: bash
        run: |
          unzip -t generated/build/app/outputs/flutter-apk/app-release.apk >/dev/null
          mkdir -p artifacts
          cp generated/build/app/outputs/flutter-apk/app-release.apk artifacts/LocalShare-Android.apk
          sha256sum artifacts/LocalShare-Android.apk > artifacts/LocalShare-Android.apk.sha256
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch APK on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r artifacts/LocalShare-Android.apk
            adb shell pm path com.mographiccode.local_share
            adb logcat -c
            adb shell am start -W -n com.mographiccode.local_share/.MainActivity
            sleep 10
            test -n "$(adb shell pidof com.mographiccode.local_share | tr -d '\r')"
            adb shell dumpsys activity activities | grep -q 'ResumedActivity:.*com.mographiccode.local_share/.MainActivity'
            adb logcat -d -v threadtime > artifacts/android-runtime.log
            test -z "$(grep -E 'FATAL EXCEPTION|AndroidRuntime: FATAL' artifacts/android-runtime.log | head -n 1)"
            adb uninstall com.mographiccode.local_share
      - uses: actions/upload-artifact@v4
        with:
          name: LocalShare-Android-Final
          path: |
            artifacts/LocalShare-Android.apk
            artifacts/LocalShare-Android.apk.sha256
          if-no-files-found: error

  windows:
    name: Windows icon release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: localshare-icon-release
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows project
        shell: pwsh
        run: |
          if (Test-Path generated) { Remove-Item generated -Recurse -Force }
          flutter config --enable-windows-desktop
          flutter create --org com.mographiccode --project-name local_share --platforms=windows generated
          Remove-Item generated/lib -Recurse -Force
          Remove-Item generated/test -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item flutter_local_share/lib generated/lib -Recurse
          Copy-Item flutter_local_share/test generated/test -Recurse
          Copy-Item flutter_local_share/pubspec.yaml generated/pubspec.yaml -Force
      - name: Apply verified LocalShare icon to Windows
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'flutter_local_share/assets/localshare_icon.jpg' -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '54d7090646e7c755c55a9c67d972d74f38fb51b3dc93448542725731a7427f8e') { throw "Icon hash mismatch: $hash" }
          python -m pip install --quiet pillow
          @'
          from PIL import Image
          from pathlib import Path
          src = Image.open('flutter_local_share/assets/localshare_icon.jpg').convert('RGBA')
          assert src.size == (128, 128)
          out = Path('generated/windows/runner/resources/app_icon.ico')
          out.parent.mkdir(parents=True, exist_ok=True)
          src.save(out, sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content icon_build.py -Encoding UTF8
          python icon_build.py
          if (-not (Test-Path 'generated/windows/runner/resources/app_icon.ico')) { throw 'Windows icon missing' }
      - name: Analyze test and build Windows
        working-directory: generated
        shell: pwsh
        run: |
          flutter pub get
          dart format lib test
          flutter analyze --fatal-warnings --no-fatal-infos
          flutter test
          flutter build windows --release
      - name: Build Windows installer with desktop shortcut
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $release = (Resolve-Path 'generated/build/windows/x64/runner/Release').Path
          $setupIcon = (Resolve-Path 'generated/windows/runner/resources/app_icon.ico').Path
          if (-not (Test-Path "$release/local_share.exe")) { throw 'Windows release executable missing' }
          $iss = @"
          [Setup]
          AppId={{8D2D488C-246B-4BDC-8C24-7B10A65B9649}
          AppName=LocalShare
          AppVersion=1.1.1
          AppPublisher=MographicCode
          DefaultDirName={autopf}\LocalShare
          DefaultGroupName=LocalShare
          OutputDir=$($PWD.Path)\artifacts
          OutputBaseFilename=LocalShare-Windows-Setup
          SetupIconFile=$setupIcon
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=admin
          UninstallDisplayIcon={app}\local_share.exe

          [Files]
          Source: "$release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\LocalShare"; Filename: "{app}\local_share.exe"; WorkingDir: "{app}"; IconFilename: "{app}\local_share.exe"
          Name: "{autodesktop}\LocalShare"; Filename: "{app}\local_share.exe"; WorkingDir: "{app}"; IconFilename: "{app}\local_share.exe"

          [Run]
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall add rule name=""LocalShare TCP"" dir=in action=allow protocol=TCP localport=40404 profile=private"; Flags: runhidden
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall add rule name=""LocalShare UDP Discovery"" dir=in action=allow protocol=UDP localport=40405 profile=private"; Flags: runhidden
          Filename: "{app}\local_share.exe"; Description: "Launch LocalShare"; Flags: nowait postinstall skipifsilent

          [UninstallRun]
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall delete rule name=""LocalShare TCP"""; Flags: runhidden; RunOnceId: "RemoveLocalShareTcp"
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall delete rule name=""LocalShare UDP Discovery"""; Flags: runhidden; RunOnceId: "RemoveLocalShareUdp"
          "@
          Set-Content installer.iss $iss -Encoding UTF8
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'artifacts/LocalShare-Windows-Setup.exe')) { throw 'Installer missing' }
          Get-FileHash artifacts/LocalShare-Windows-Setup.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  LocalShare-Windows-Setup.exe" } | Set-Content artifacts/LocalShare-Windows-Setup.exe.sha256
      - name: Install and verify Windows desktop shortcut
        shell: pwsh
        run: |
          $setup = (Resolve-Path 'artifacts/LocalShare-Windows-Setup.exe').Path
          $install = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exit code $($install.ExitCode)" }
          $exe = 'C:\Program Files\LocalShare\local_share.exe'
          if (-not (Test-Path $exe)) { throw 'Installed local_share.exe missing' }
          $desktopCandidates = @("$env:PUBLIC\Desktop\LocalShare.lnk", "$env:USERPROFILE\Desktop\LocalShare.lnk")
          $shortcut = $desktopCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $shortcut) { throw 'LocalShare desktop shortcut missing' }
          $ws = New-Object -ComObject WScript.Shell
          $lnk = $ws.CreateShortcut($shortcut)
          if ($lnk.TargetPath -ne $exe) { throw "Shortcut target incorrect: $($lnk.TargetPath)" }
          if ($lnk.IconLocation -notmatch 'local_share.exe') { throw "Shortcut icon incorrect: $($lnk.IconLocation)" }
          $proc = Start-Process $exe -PassThru
          Start-Sleep 8
          if ($proc.HasExited) { throw "LocalShare exited unexpectedly" }
          if (-not (Get-NetFirewallRule -DisplayName 'LocalShare TCP' -ErrorAction SilentlyContinue)) { throw 'TCP firewall rule missing' }
          if (-not (Get-NetFirewallRule -DisplayName 'LocalShare UDP Discovery' -ErrorAction SilentlyContinue)) { throw 'UDP firewall rule missing' }
          Stop-Process -Id $proc.Id -Force
          $uninstaller = 'C:\Program Files\LocalShare\unins000.exe'
          $uninstall = Start-Process $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exit code $($uninstall.ExitCode)" }
          Start-Sleep 2
          if (Test-Path $exe) { throw 'Application executable remained after uninstall' }
          if ($desktopCandidates | Where-Object { Test-Path $_ }) { throw 'Desktop shortcut remained after uninstall' }
          if (Get-NetFirewallRule -DisplayName 'LocalShare TCP' -ErrorAction SilentlyContinue) { throw 'TCP firewall rule remained after uninstall' }
          if (Get-NetFirewallRule -DisplayName 'LocalShare UDP Discovery' -ErrorAction SilentlyContinue) { throw 'UDP firewall rule remained after uninstall' }
      - uses: actions/upload-artifact@v4
        with:
          name: LocalShare-Windows-Final
          path: |
            artifacts/LocalShare-Windows-Setup.exe
            artifacts/LocalShare-Windows-Setup.exe.sha256
          if-no-files-found: error
