name: Build WAQT APK

on:
  push:
    branches:
      - waqt-apk-build
    paths-ignore:
      - 'ci-output/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'ci-output/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: waqt-apk-build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Verify, analyze, test, and build
        shell: bash
        run: |
          rm -rf ci-output app source waqt_source.b64 waqt_ci_source.zip
          mkdir -p ci-output
          set +e
          (
            set -e
            echo '=== TOOLCHAIN ==='
            flutter --version
            java -version

            echo '=== SOURCE INTEGRITY ==='
            cat ci/waqt_source.b64.* > waqt_source.b64
            base64 --decode waqt_source.b64 > waqt_ci_source.zip
            echo '9a3b68c899a9c6686a141a59a531b24ca4108f321dde6dd97ddd5bf07ff0c121  waqt_ci_source.zip' | sha256sum --check
            unzip -t waqt_ci_source.zip

            echo '=== CREATE ANDROID SCAFFOLD ==='
            mkdir app
            cd app
            flutter create --platforms=android --org com.waqt --project-name waqt_alarm .
            cd ..

            echo '=== OVERLAY WAQT SOURCE + QA PATCHES ==='
            mkdir source
            unzip -q waqt_ci_source.zip -d source
            python3 - <<'PY'
          from pathlib import Path

          p = Path('source/waqt_alarm/lib/core/utils/time_utils.dart')
          s = p.read_text()
          s = s.replace("if (days.length == 5 && days.containsAll(<int>[1, 2, 3, 4, 5])) return 'أيام العمل';", "if (days.length == 5 && <int>[1, 2, 3, 4, 5].every(days.contains)) return 'أيام العمل';")
          p.write_text(s)

          p = Path('source/waqt_alarm/lib/services/notification_service.dart')
          p.write_text(p.read_text().replace("import 'dart:typed_data';\n", ''))

          p = Path('source/waqt_alarm/lib/screens/alarm_ring_screen.dart')
          s = p.read_text()
          s = s.replace("  Future<void> _dismiss() async {\n    await NotificationService.instance.cancel(widget.notificationId);\n    final AlarmModel? alarm = _alarm;\n    if (alarm != null && alarm.daysOfWeek.isEmpty && alarm.enabled) {\n      await context.read<AppState>().toggleAlarm(alarm, false);\n    }\n    if (mounted) Navigator.of(context).pop();\n  }", "  Future<void> _dismiss() async {\n    final AppState state = context.read<AppState>();\n    final AlarmModel? alarm = state.alarmById(widget.alarmId);\n    await NotificationService.instance.cancel(widget.notificationId);\n    if (alarm != null && alarm.daysOfWeek.isEmpty && alarm.enabled) {\n      await state.toggleAlarm(alarm, false);\n    }\n    if (mounted) Navigator.of(context).pop();\n  }")
          p.write_text(s)

          p = Path('source/waqt_alarm/lib/app.dart')
          s = p.read_text()
          s = s.replace("      final MedicationModel? med = state.medicationById(id);\n      final BuildContext? navContext = appNavigatorKey.currentContext;\n      if (med != null && navContext != null) {\n        await Navigator.of(navContext).push(MaterialPageRoute<void>(\n          builder: (_) => MedicationEditorScreen(existing: med),\n        ));\n      }", "      final MedicationModel? med = state.medicationById(id);\n      final NavigatorState? navigator = appNavigatorKey.currentState;\n      if (med != null && navigator != null) {\n        await navigator.push(MaterialPageRoute<void>(\n          builder: (_) => MedicationEditorScreen(existing: med),\n        ));\n      }")
          s = s.replace("      final task = state.taskById(id);\n      final BuildContext? navContext = appNavigatorKey.currentContext;\n      if (task != null && navContext != null) {\n        await Navigator.of(navContext).push(MaterialPageRoute<void>(\n          builder: (_) => TaskEditorScreen(existing: task),\n        ));\n      }", "      final task = state.taskById(id);\n      final NavigatorState? navigator = appNavigatorKey.currentState;\n      if (task != null && navigator != null) {\n        await navigator.push(MaterialPageRoute<void>(\n          builder: (_) => TaskEditorScreen(existing: task),\n        ));\n      }")
          p.write_text(s)
          PY
            cp -R source/waqt_alarm/lib app/
            rm -rf app/test
            cp -R source/waqt_alarm/test app/test
            cp source/waqt_alarm/pubspec.yaml app/pubspec.yaml
            cp source/waqt_alarm/analysis_options.yaml app/analysis_options.yaml
            cp ci/waqt_build.gradle.kts app/android/app/build.gradle.kts
            cp source/waqt_alarm/android/app/src/main/AndroidManifest.xml app/android/app/src/main/AndroidManifest.xml
            rm -rf app/android/app/src/main/kotlin
            mkdir -p app/android/app/src/main/kotlin/com/waqt/alarm
            cp ci/MainActivity.kt app/android/app/src/main/kotlin/com/waqt/alarm/MainActivity.kt
            mkdir -p app/android/app/src/main/res/drawable app/android/app/src/main/res/raw app/android/app/src/main/res/values app/android/app/src/main/res/values-night
            cp source/waqt_alarm/android/app/src/main/res/drawable/ic_stat_alarm.xml app/android/app/src/main/res/drawable/
            cp source/waqt_alarm/android/app/src/main/res/raw/keep.xml app/android/app/src/main/res/raw/
            cp source/waqt_alarm/android/app/src/main/res/values/styles.xml app/android/app/src/main/res/values/styles.xml
            cp source/waqt_alarm/android/app/src/main/res/values-night/styles.xml app/android/app/src/main/res/values-night/styles.xml
            cp source/waqt_alarm/android/app/src/main/res/values/colors.xml app/android/app/src/main/res/values/colors.xml

            cd app
            echo '=== PUB GET ==='
            flutter pub get
            echo '=== ANALYZE ==='
            flutter analyze --no-fatal-infos
            echo '=== TEST ==='
            flutter test
            echo '=== RELEASE APK BUILD ==='
            flutter build apk --release
            cd ..

            cp app/build/app/outputs/flutter-apk/app-release.apk ci-output/WAQT-Advanced-Alarm-test.apk
            sha256sum ci-output/WAQT-Advanced-Alarm-test.apk | tee ci-output/WAQT-Advanced-Alarm-test.apk.sha256
            echo SUCCESS > ci-output/status.txt
          ) 2>&1 | tee ci-output/build.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            echo "FAILED:$result" > ci-output/status.txt
          fi
          echo "pipeline_exit=$result" >> ci-output/status.txt
          exit 0

      - name: Publish CI result to temporary branch
        if: always()
        shell: bash
        run: |
          mkdir -p ci-output
          if [ ! -f ci-output/status.txt ]; then echo 'FAILED:setup-or-runner' > ci-output/status.txt; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f ci-output
          git commit -m 'ci: WAQT build result [skip ci]' || exit 0
          git push origin HEAD:waqt-apk-build
