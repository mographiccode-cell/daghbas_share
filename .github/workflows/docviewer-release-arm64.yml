name: temporary-docviewer-arm64-release
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-release:
    if: github.head_ref == 'docviewer-apk-build-20260821'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Reconstruct proven project
        run: |
          mkdir -p docviewer_build
          cat docviewer_apk_payload/part*.b64 | base64 -d > /tmp/docviewer.tar.gz
          tar -xzf /tmp/docviewer.tar.gz -C docviewer_build
          touch docviewer_build/README.md
          cp docviewer_apk_payload/patch/pubspec.yaml docviewer_build/pubspec.yaml
          cp docviewer_apk_payload/patch/document_item.dart docviewer_build/lib/models/document_item.dart
          cp docviewer_apk_payload/patch/viewer_screen.dart docviewer_build/lib/screens/viewer_screen.dart
          cp docviewer_apk_payload/patch/home_screen.dart docviewer_build/lib/screens/home_screen.dart
          cp docviewer_apk_payload/patch/document_tile.dart docviewer_build/lib/widgets/document_tile.dart
          cp docviewer_apk_payload/patch/main.dart docviewer_build/lib/main.dart
          sed -i '/allowMultiple: true,/d' docviewer_build/lib/services/file_service.dart
          rm -f docviewer_build/lib/services/document_viewer_service.dart
          ! grep -R "openDocument(" -n docviewer_build/lib
          grep -q 'DocViewerView' docviewer_build/lib/screens/viewer_screen.dart
      - name: Add recent documents UX
        working-directory: docviewer_build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/home_screen.dart')
          s = p.read_text()
          s = s.replace('  bool favoritesOnly = false;\n  bool busy = false;', '  bool favoritesOnly = false;\n  bool recentOnly = false;\n  bool busy = false;')
          old = """  List<DocumentItem> get visible => DocumentFilter.apply(\n        all,\n        query: search.text,\n        kind: filter,\n        favoritesOnly: favoritesOnly,\n        sort: sort,\n      );\n"""
          new = """  List<DocumentItem> get visible {\n    final result = DocumentFilter.apply(\n      all,\n      query: search.text,\n      kind: filter,\n      favoritesOnly: favoritesOnly,\n      sort: sort,\n    );\n    if (recentOnly) {\n      result.removeWhere((item) => item.lastOpenedAt == null);\n      result.sort((a, b) => b.lastOpenedAt!.compareTo(a.lastOpenedAt!));\n    }\n    return result;\n  }\n"""
          if old not in s:
              raise SystemExit('visible getter patch point not found')
          s = s.replace(old, new)
          s = s.replace("selected: filter == null && !favoritesOnly,", "selected: filter == null && !favoritesOnly && !recentOnly,")
          s = s.replace("onSelected: (_) => setState(() { filter = null; favoritesOnly = false; }),", "onSelected: (_) => setState(() { filter = null; favoritesOnly = false; recentOnly = false; }),")
          s = s.replace("onSelected: (value) => setState(() => favoritesOnly = value),", "onSelected: (value) => setState(() { favoritesOnly = value; recentOnly = false; }),")
          favorite_block = """                FilterChip(\n                  label: const Text('المفضلة'),\n                  avatar: const Icon(Icons.star_rounded, size: 18),\n                  selected: favoritesOnly,\n                  onSelected: (value) => setState(() { favoritesOnly = value; recentOnly = false; }),\n                ),\n"""
          recent_block = favorite_block + """                const SizedBox(width: 8),\n                FilterChip(\n                  label: const Text('الأخيرة'),\n                  avatar: const Icon(Icons.history_rounded, size: 18),\n                  selected: recentOnly,\n                  onSelected: (value) => setState(() { recentOnly = value; favoritesOnly = false; }),\n                ),\n"""
          if favorite_block not in s:
              raise SystemExit('favorites chip patch point not found')
          s = s.replace(favorite_block, recent_block, 1)
          s = s.replace("onSelected: (_) => setState(() { filter = filter == kind ? null : kind; favoritesOnly = false; }),", "onSelected: (_) => setState(() { filter = filter == kind ? null : kind; favoritesOnly = false; recentOnly = false; }),")
          s = s.replace("Text('${all.length} مستندًا على الهاتف', style: Theme.of(context).textTheme.labelMedium),", "Text('${docs.length} ظاهر من ${all.length} مستندًا', style: Theme.of(context).textTheme.labelMedium),")
          s = s.replace('onRefresh: _load,', 'onRefresh: () => _load(pruneMissing: true),')
          p.write_text(s)
          assert 'bool recentOnly = false;' in s
          assert "label: const Text('الأخيرة')" in s
          PY
      - name: Bootstrap Android project
        working-directory: docviewer_build
        run: bash tool/bootstrap_android.sh
      - name: Apply adaptive launcher icon
        working-directory: docviewer_build
        run: |
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/values
          cp ../docviewer_apk_payload/patch/ic_launcher_foreground.xml android/app/src/main/res/drawable/ic_launcher_foreground.xml
          cp ../docviewer_apk_payload/patch/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp ../docviewer_apk_payload/patch/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          cp ../docviewer_apk_payload/patch/colors.xml android/app/src/main/res/values/ic_launcher_colors.xml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          if 'android:roundIcon=' not in s:
              s=s.replace('android:icon="@mipmap/ic_launcher"\n', 'android:icon="@mipmap/ic_launcher"\n        android:roundIcon="@mipmap/ic_launcher_round"\n')
          p.write_text(s)
          PY
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/res/drawable/ic_launcher_foreground.xml
      - name: Patch Android release compatibility
        working-directory: docviewer_build
        run: |
          plugin_dir="$PUB_CACHE/hosted/pub.dev/doc_viewer-0.0.3"
          grep -RIl 'com.github.barteksc:android-pdf-viewer:2.8.2' "$plugin_dir" | while read -r f; do
            sed -i 's#com.github.barteksc:android-pdf-viewer:2.8.2#com.github.mhiew:android-pdf-viewer:3.2.0-beta.3#g' "$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          s = re.sub(r'(?m)^(\s*)compileSdk\s*=.*$', r'\1compileSdk = 37', s)
          s = re.sub(r'(?m)^(\s*)minSdk\s*=.*$', r'\1minSdk = 26', s)
          marker = '        targetCompatibility = JavaVersion.VERSION_17\n'
          if 'isCoreLibraryDesugaringEnabled = true' not in s:
              s = s.replace(marker, marker + '        isCoreLibraryDesugaringEnabled = true\n')
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' not in s:
              s += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
          p.write_text(s)
          assert re.search(r'(?m)^\s*minSdk\s*=\s*26\s*$', s)
          assert re.search(r'(?m)^\s*compileSdk\s*=\s*37\s*$', s)
          PY
      - name: Analyze
        working-directory: docviewer_build
        run: |
          rm -f test/widget_test.dart
          flutter analyze --fatal-infos
      - name: Unit tests
        working-directory: docviewer_build
        run: flutter test
      - name: Build optimized ARM64 release APK
        working-directory: docviewer_build
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --obfuscate --split-debug-info=build/symbols
      - name: Verify final APK
        working-directory: docviewer_build
        run: |
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep 'lib/arm64-v8a/' >/dev/null
          ! unzip -l "$APK" | grep -E 'lib/(x86_64|armeabi-v7a)/'
          ! unzip -l "$APK" | grep 'kernel_blob.bin'
          sha256sum "$APK" | tee "$APK.sha256"
          ls -lh "$APK"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build/app/outputs/flutter-apk/app-arm64-v8a-release.apk')
          print(f'APK_BYTES={p.stat().st_size}')
          print(f'APK_MIB={p.stat().st_size/1024/1024:.2f}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: UniversalDocViewer-v2.2-Final-ARM64
          path: |
            docviewer_build/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            docviewer_build/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk.sha256
          if-no-files-found: error
          retention-days: 7
