name: temporary-docviewer-arm64-release
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-release:
    if: github.head_ref == 'docviewer-apk-build-20260821'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Reconstruct project
        run: |
          mkdir -p docviewer_build
          cat docviewer_apk_payload/part*.b64 | base64 -d > /tmp/docviewer.tar.gz
          tar -xzf /tmp/docviewer.tar.gz -C docviewer_build
          touch docviewer_build/README.md
          cp docviewer_apk_payload/patch/pubspec.yaml docviewer_build/pubspec.yaml
          cp docviewer_apk_payload/patch/document_item.dart docviewer_build/lib/models/document_item.dart
          cp docviewer_apk_payload/patch/viewer_screen.dart docviewer_build/lib/screens/viewer_screen.dart
          cp docviewer_apk_payload/patch/home_screen.dart docviewer_build/lib/screens/home_screen.dart
          cp docviewer_apk_payload/patch/document_tile.dart docviewer_build/lib/widgets/document_tile.dart
          cp docviewer_apk_payload/patch/main.dart docviewer_build/lib/main.dart
          sed -i '/allowMultiple: true,/d' docviewer_build/lib/services/file_service.dart
          rm -f docviewer_build/lib/services/document_viewer_service.dart
          ! grep -R "openDocument(" -n docviewer_build/lib
          grep -q 'DocViewerView' docviewer_build/lib/screens/viewer_screen.dart
          grep -q 'DocxView(' docviewer_build/lib/screens/viewer_screen.dart
          grep -q 'DocxSearchController' docviewer_build/lib/screens/viewer_screen.dart
          grep -q 'docx_file_viewer' docviewer_build/pubspec.yaml
          grep -q 'version: 2.5.0+7' docviewer_build/pubspec.yaml

      - name: Bootstrap Android project
        working-directory: docviewer_build
        run: bash tool/bootstrap_android.sh

      - name: Apply safe adaptive launcher icon
        working-directory: docviewer_build
        run: |
          mkdir -p android/app/src/main/res/drawable \
                   android/app/src/main/res/mipmap-anydpi-v26 \
                   android/app/src/main/res/mipmap-anydpi-v33 \
                   android/app/src/main/res/values
          cp ../docviewer_apk_payload/patch/ic_launcher_foreground.xml android/app/src/main/res/drawable/ic_launcher_foreground.xml
          cp ../docviewer_apk_payload/patch/ic_launcher_monochrome.xml android/app/src/main/res/drawable/ic_launcher_monochrome.xml
          cp ../docviewer_apk_payload/patch/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp ../docviewer_apk_payload/patch/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          cp ../docviewer_apk_payload/patch/ic_launcher_v33.xml android/app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml
          cp ../docviewer_apk_payload/patch/ic_launcher_v33.xml android/app/src/main/res/mipmap-anydpi-v33/ic_launcher_round.xml
          cp ../docviewer_apk_payload/patch/colors.xml android/app/src/main/res/values/ic_launcher_colors.xml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          if 'android:roundIcon=' not in s:
              s=s.replace('android:icon="@mipmap/ic_launcher"\n', 'android:icon="@mipmap/ic_launcher"\n        android:roundIcon="@mipmap/ic_launcher_round"\n')
          p.write_text(s)
          PY
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/res/drawable/ic_launcher_foreground.xml
          test -s android/app/src/main/res/drawable/ic_launcher_monochrome.xml

      - name: Patch Android release compatibility
        working-directory: docviewer_build
        run: |
          plugin_dir="$PUB_CACHE/hosted/pub.dev/doc_viewer-0.0.3"
          grep -RIl 'com.github.barteksc:android-pdf-viewer:2.8.2' "$plugin_dir" | while read -r f; do
            sed -i 's#com.github.barteksc:android-pdf-viewer:2.8.2#com.github.mhiew:android-pdf-viewer:3.2.0-beta.3#g' "$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          s = re.sub(r'(?m)^(\s*)compileSdk\s*=.*$', r'\1compileSdk = 37', s)
          s = re.sub(r'(?m)^(\s*)minSdk\s*=.*$', r'\1minSdk = 26', s)
          s = re.sub(r'(?m)^(\s*)applicationId\s*=.*$', r'\1applicationId = "com.mographiccode.mustanadati.app"', s)
          marker = '        targetCompatibility = JavaVersion.VERSION_17\n'
          if 'isCoreLibraryDesugaringEnabled = true' not in s:
              s = s.replace(marker, marker + '        isCoreLibraryDesugaringEnabled = true\n')
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' not in s:
              s += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
          p.write_text(s)
          assert 'applicationId = "com.mographiccode.mustanadati.app"' in s
          assert re.search(r'(?m)^\s*minSdk\s*=\s*26\s*$', s)
          assert re.search(r'(?m)^\s*compileSdk\s*=\s*37\s*$', s)

          m = Path('android/app/src/main/AndroidManifest.xml')
          manifest = m.read_text()
          if 'xmlns:tools=' not in manifest:
              manifest = manifest.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android"', '<manifest xmlns:android="http://schemas.android.com/apk/res/android"\n    xmlns:tools="http://schemas.android.com/tools"')
          for permission in ['android.permission.READ_MEDIA_IMAGES','android.permission.READ_MEDIA_VIDEO','android.permission.READ_MEDIA_AUDIO']:
              node = f'    <uses-permission android:name="{permission}" tools:node="remove" />\n'
              if node.strip() not in manifest:
                  manifest = manifest.replace('<application', node + '<application', 1)
          m.write_text(manifest)
          PY

      - name: Analyze
        working-directory: docviewer_build
        run: |
          rm -f test/widget_test.dart
          flutter analyze --fatal-infos

      - name: Unit tests
        working-directory: docviewer_build
        run: |
          mkdir -p test
          cat > test/document_filter_test.dart <<'DART'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:universal_doc_viewer/models/document_filter.dart';
          import 'package:universal_doc_viewer/models/document_item.dart';
          DocumentItem item(String name, String ext, {bool favorite = false, DateTime? opened}) => DocumentItem(
            path: '/tmp/$name.$ext', name: '$name.$ext', extension: ext, size: 1024,
            modifiedAt: DateTime(2026, 8, 21), isFavorite: favorite, lastOpenedAt: opened,
          );
          void main() {
            final docs = [
              item('report','pdf',favorite:true),
              item('project','docx', opened: DateTime(2026, 8, 21, 10)),
              item('budget','xlsx'),
            ];
            test('search and favorites work', () {
              expect(DocumentFilter.apply(docs, query: 'project').single.kind, DocumentKind.word);
              expect(DocumentFilter.apply(docs, favoritesOnly: true).single.name, 'report.pdf');
            });
            test('kind filter isolates Excel', () {
              expect(DocumentFilter.apply(docs, kind: DocumentKind.excel).single.extension, 'xlsx');
            });
            test('DOCX maps to Word', () {
              expect(DocumentItem.kindForExtension('docx'), DocumentKind.word);
            });
          }
          DART
          flutter test test/document_filter_test.dart

      - name: Build optimized ARM64 release APK
        working-directory: docviewer_build
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --obfuscate --split-debug-info=build/symbols

      - name: Align sign and verify APK
        working-directory: docviewer_build
        run: |
          set -euo pipefail
          INPUT=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          ALIGNED=build/app/outputs/flutter-apk/mustanadati-v25-aligned.apk
          FINAL=build/app/outputs/flutter-apk/Mustanadati-v2.5.0-Redesign-ARM64.apk
          PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$PASS"
          KS=/tmp/mustanadati-v25-release.jks
          KEY_ALIAS=mustanadati
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name zipalign | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          keytool -genkeypair -noprompt -keystore "$KS" -storepass "$PASS" -keypass "$PASS" -alias "$KEY_ALIAS" -keyalg RSA -keysize 4096 -validity 3650 -dname 'CN=Mustanadati, OU=Android, O=Mographiccode, L=Sanaa, C=YE'
          "$ZIPALIGN" -P 16 -f 4 "$INPUT" "$ALIGNED"
          "$APKSIGNER" sign --ks "$KS" --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v2-signing-enabled true --v3-signing-enabled true --out "$FINAL" "$ALIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$FINAL" | tee build/app/outputs/flutter-apk/signing-verification.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' build/app/outputs/flutter-apk/signing-verification.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' build/app/outputs/flutter-apk/signing-verification.txt
          "$ZIPALIGN" -c -P 16 -v 4 "$FINAL" >/dev/null
          "$AAPT" dump badging "$FINAL" | tee build/app/outputs/flutter-apk/badging.txt
          grep -q "package: name='com.mographiccode.mustanadati.app'" build/app/outputs/flutter-apk/badging.txt
          grep -q "versionName='2.5.0'" build/app/outputs/flutter-apk/badging.txt
          grep -q "sdkVersion:'26'" build/app/outputs/flutter-apk/badging.txt
          grep -q "native-code: 'arm64-v8a'" build/app/outputs/flutter-apk/badging.txt
          ! grep -q 'android.permission.READ_MEDIA_IMAGES' build/app/outputs/flutter-apk/badging.txt
          ! grep -q 'android.permission.READ_MEDIA_VIDEO' build/app/outputs/flutter-apk/badging.txt
          ! grep -q 'android.permission.READ_MEDIA_AUDIO' build/app/outputs/flutter-apk/badging.txt
          unzip -t "$FINAL" >/dev/null
          ! unzip -l "$FINAL" | grep -E 'lib/(x86_64|armeabi-v7a)/'
          ! unzip -l "$FINAL" | grep 'kernel_blob.bin'
          sha256sum "$FINAL" | tee "$FINAL.sha256"
          ls -lh "$FINAL"

      - uses: actions/upload-artifact@v4
        with:
          name: Mustanadati-v2.5.0-Redesign-Signed-ARM64
          path: |
            docviewer_build/build/app/outputs/flutter-apk/Mustanadati-v2.5.0-Redesign-ARM64.apk
            docviewer_build/build/app/outputs/flutter-apk/Mustanadati-v2.5.0-Redesign-ARM64.apk.sha256
            docviewer_build/build/app/outputs/flutter-apk/signing-verification.txt
            docviewer_build/build/app/outputs/flutter-apk/badging.txt
          if-no-files-found: error
          retention-days: 7
