name: temporary-docviewer-arm64-release
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-release:
    if: github.head_ref == 'docviewer-apk-build-20260821'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Reconstruct final v2.2 project
        run: |
          mkdir -p docviewer_build
          base64 -d docviewer_apk_payload/v22_source.b64 > /tmp/docviewer-v22.tar.gz
          tar -xzf /tmp/docviewer-v22.tar.gz -C docviewer_build
          mkdir -p docviewer_build/assets
          base64 -d docviewer_apk_payload/app_icon_192.b64 > docviewer_build/assets/app_icon.png
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "docviewer_build/android/app/src/main/res/$d"
            cp docviewer_build/assets/app_icon.png "docviewer_build/android/app/src/main/res/$d/ic_launcher.png"
            cp docviewer_build/assets/app_icon.png "docviewer_build/android/app/src/main/res/$d/ic_launcher_round.png"
          done
          test -s docviewer_build/assets/app_icon.png
          grep -q 'version: 2.2.0+4' docviewer_build/pubspec.yaml
          grep -q 'DocViewerView' docviewer_build/lib/screens/viewer_screen.dart
          grep -q 'NavigationBar' docviewer_build/lib/screens/home_screen.dart
      - name: Bootstrap Android project
        working-directory: docviewer_build
        run: bash tool/bootstrap_android.sh
      - name: Verify launcher branding
        working-directory: docviewer_build
        run: |
          test -s assets/app_icon.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' android/app/src/main/AndroidManifest.xml
      - name: Patch Android release compatibility
        working-directory: docviewer_build
        run: |
          plugin_dir="$PUB_CACHE/hosted/pub.dev/doc_viewer-0.0.3"
          grep -RIl 'com.github.barteksc:android-pdf-viewer:2.8.2' "$plugin_dir" | while read -r f; do
            sed -i 's#com.github.barteksc:android-pdf-viewer:2.8.2#com.github.mhiew:android-pdf-viewer:3.2.0-beta.3#g' "$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          s = re.sub(r'(?m)^(\s*)compileSdk\s*=.*$', r'\1compileSdk = 37', s)
          s = re.sub(r'(?m)^(\s*)minSdk\s*=.*$', r'\1minSdk = 26', s)
          marker = '        targetCompatibility = JavaVersion.VERSION_17\n'
          if 'isCoreLibraryDesugaringEnabled = true' not in s:
              s = s.replace(marker, marker + '        isCoreLibraryDesugaringEnabled = true\n')
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' not in s:
              s += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
          p.write_text(s)
          assert re.search(r'(?m)^\s*minSdk\s*=\s*26\s*$', s)
          assert re.search(r'(?m)^\s*compileSdk\s*=\s*37\s*$', s)
          PY
      - name: Analyze
        working-directory: docviewer_build
        run: |
          rm -f test/widget_test.dart
          flutter analyze --fatal-infos
      - name: Unit tests
        working-directory: docviewer_build
        run: flutter test
      - name: Build optimized ARM64 release APK
        working-directory: docviewer_build
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --obfuscate --split-debug-info=build/symbols
      - name: Verify final APK
        working-directory: docviewer_build
        run: |
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep 'lib/arm64-v8a/' >/dev/null
          ! unzip -l "$APK" | grep -E 'lib/(x86_64|armeabi-v7a)/'
          ! unzip -l "$APK" | grep 'kernel_blob.bin'
          sha256sum "$APK" | tee "$APK.sha256"
          ls -lh "$APK"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build/app/outputs/flutter-apk/app-arm64-v8a-release.apk')
          print(f'APK_BYTES={p.stat().st_size}')
          print(f'APK_MIB={p.stat().st_size/1024/1024:.2f}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: UniversalDocViewer-v2.2-Final-ARM64
          path: |
            docviewer_build/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            docviewer_build/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk.sha256
          if-no-files-found: error
          retention-days: 7
