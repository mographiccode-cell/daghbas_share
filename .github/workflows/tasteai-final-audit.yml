name: TasteAI Final Mobile Audit

on:
  push:
    branches:
      - tasteai-final-audit-rebuild-20260811
  workflow_dispatch:

jobs:
  flutter-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Recreate checksum-verified TasteAI source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf audit_app
          mkdir -p audit_app
          cat tasteai-final-audit/source_parts/part_*.txt | base64 --decode > tasteai_mobile_min.tar.xz
          echo '996b9bea91d709aa1c407d3cd00c2be82cffc0a7d4ab0b702adce8f8330735c5  tasteai_mobile_min.tar.xz' | sha256sum -c -
          echo 'b232609cabe7b13252454b1d0b74273077babe8abb4f8eb1543240915cb7e105  tasteai-final-audit/final_delta.patch' | sha256sum -c -
          echo '3fbd0688548767aff8857a2724a8d4727fb6637e39c7dde4b6e198f5fefd511c  tasteai-final-audit/overrides/bootstrap_android_manifest.py' | sha256sum -c -
          echo '14845642b81b57d478a9f1cb82270f80ef78a25f66a9eb17030992d02779b382  tasteai-final-audit/overrides/model_contract_test.dart' | sha256sum -c -
          echo '57131c2070a38403bb049b727af391e7ab679066ea5b5804bbbe9b7ca1bbfb11  tasteai-final-audit/overrides/app_shell_widget_test.dart' | sha256sum -c -
          test "$(git hash-object tasteai-final-audit/overrides/app_shell_screen.dart)" = '2cebc153985dacbc85e8f82e5cbd3ea24b6cf367'
          tar -xJf tasteai_mobile_min.tar.xz -C audit_app
          cd audit_app/mobile
          patch -p1 < ../../tasteai-final-audit/final_delta.patch
          rm -f lib/screens/home_screen.dart
          cp ../../tasteai-final-audit/overrides/app_shell_screen.dart lib/screens/app_shell_screen.dart
          cp ../../tasteai-final-audit/overrides/bootstrap_android_manifest.py bootstrap_android_manifest.py
          cp ../../tasteai-final-audit/overrides/model_contract_test.dart test/model_contract_test.dart
          cp ../../tasteai-final-audit/overrides/app_shell_widget_test.dart test/app_shell_widget_test.dart
          test -f lib/screens/top_rated_screen.dart
          grep -q 'AppShellScreen' lib/main.dart
          grep -q 'Minimum review count' lib/screens/app_shell_screen.dart
          grep -q 'Price range' lib/screens/app_shell_screen.dart
          grep -q 'Distance filtering requires current location' lib/screens/app_shell_screen.dart
          grep -q 'showModalBottomSheet<Map<String, String>>' lib/screens/app_shell_screen.dart
          flutter create . --platforms web,android --project-name restaurant_ai_mobile --org com.tasteai
          rm -f test/widget_test.dart
          python3 bootstrap_android_manifest.py
          printf '\nMAPS_API_KEY=TEST_BUILD_ONLY_NOT_A_REAL_KEY\n' >> android/local.properties

      - name: Flutter pub get
        working-directory: audit_app/mobile
        run: flutter pub get

      - name: Flutter analyze
        working-directory: audit_app/mobile
        run: flutter analyze

      - name: Flutter tests
        working-directory: audit_app/mobile
        run: flutter test

      - name: Build Flutter Web
        working-directory: audit_app/mobile
        run: flutter build web --release --dart-define=API_BASE_URL=http://127.0.0.1:8000

      - name: Build Android debug APK
        working-directory: audit_app/mobile
        run: flutter build apk --debug --dart-define=API_BASE_URL=http://10.0.2.2:8000

      - name: Audit generated outputs
        working-directory: audit_app/mobile
        shell: bash
        run: |
          set -euxo pipefail
          test -f build/web/index.html
          test -f build/app/outputs/flutter-apk/app-debug.apk
          grep -q 'com.google.android.geo.API_KEY' android/app/src/main/AndroidManifest.xml
          grep -q 'ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'minSdk = 24' android/app/build.gradle.kts
          sha256sum build/app/outputs/flutter-apk/app-debug.apk | tee build/apk.sha256

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: tasteai-final-real-web-build
          path: audit_app/mobile/build/web
          retention-days: 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tasteai-final-debug-apk
          path: |
            audit_app/mobile/build/app/outputs/flutter-apk/app-debug.apk
            audit_app/mobile/build/apk.sha256
          retention-days: 1
