name: TasteAI Flutter Web Preview

on:
  push:
    branches:
      - tasteai-web-preview-20260811
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter Web review app
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf tasteai-web-preview/app
          flutter create tasteai-web-preview/app --platforms web --project-name tasteai_web_preview --org com.tasteai
          cp tasteai-web-preview/app_main.dart tasteai-web-preview/app/lib/main.dart
          cp tasteai-web-preview/preview_pubspec.yaml tasteai-web-preview/app/pubspec.yaml
          rm -rf tasteai-web-preview/app/test
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tasteai-web-preview/app/lib/main.dart')
          s=p.read_text()
          s=s.replace("r'$'*p.p", "List.filled(p.p, r'$').join()")
          s=s.replace("r'$'*price.round()", "List.filled(price.round(), r'$').join()")
          lines=s.splitlines()
          for idx in (17,20,25):
              lines[idx]=lines[idx][:-1]+');' if lines[idx].endswith(';') else lines[idx]+')'
          p.write_text('\n'.join(lines)+'\n')
          PY

      - name: Resolve dependencies
        working-directory: tasteai-web-preview/app
        run: flutter pub get

      - name: Flutter analyze
        working-directory: tasteai-web-preview/app
        run: flutter analyze

      - name: Build Flutter web
        working-directory: tasteai-web-preview/app
        run: flutter build web --release

      - name: Make build portable
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tasteai-web-preview/app/build/web/index.html')
          s=p.read_text().replace('<base href="/">','<base href="./">')
          p.write_text(s)
          PY

      - name: Capture real Flutter Web screenshots in Chrome
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p tasteai-web-preview/screens
          python3 -m http.server 8080 --bind 127.0.0.1 --directory tasteai-web-preview/app/build/web >/tmp/tasteai-http.log 2>&1 &
          cd tasteai-web-preview
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24.16.0 --no-save >/dev/null 2>&1
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node capture.js
          ls -lh screens

      - name: Upload Flutter screenshots
        uses: actions/upload-artifact@v4
        with:
          name: tasteai-flutter-runtime-screenshots
          path: tasteai-web-preview/screens
          if-no-files-found: error
          retention-days: 1

      - name: Upload Flutter web build
        uses: actions/upload-artifact@v4
        with:
          name: tasteai-flutter-web-build
          path: tasteai-web-preview/app/build/web
          if-no-files-found: error
          retention-days: 1

      - name: Publish static Flutter Web runtime
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: tasteai-web-preview/app/build/web
          publish_branch: tasteai-flutter-runtime
          force_orphan: true
