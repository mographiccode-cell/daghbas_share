name: LocalShare Release V3

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flutter-local-share-v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        shell: bash
        run: |
          rm -rf generated
          flutter create --org com.mographiccode --project-name local_share --platforms=android generated
          rm -rf generated/lib generated/test
          cp -R flutter_local_share/lib generated/lib
          cp -R flutter_local_share/test generated/test
          cp flutter_local_share/pubspec.yaml generated/pubspec.yaml
          cp flutter_local_share/overrides/AndroidManifest.xml generated/android/app/src/main/AndroidManifest.xml
          cp flutter_local_share/overrides/MainActivity.kt generated/android/app/src/main/kotlin/com/mographiccode/local_share/MainActivity.kt
      - name: Analyze test and build Android
        working-directory: generated
        run: |
          flutter pub get
          dart format lib test
          flutter analyze --no-fatal-infos
          flutter test
          flutter build apk --release
      - name: Stage Android artifact
        shell: bash
        run: |
          mkdir -p artifacts
          cp generated/build/app/outputs/flutter-apk/app-release.apk artifacts/LocalShare-Android.apk
          sha256sum artifacts/LocalShare-Android.apk > artifacts/LocalShare-Android.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: LocalShare-Android-V3
          path: artifacts/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flutter-local-share-v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows project
        shell: pwsh
        run: |
          if (Test-Path generated) { Remove-Item generated -Recurse -Force }
          flutter config --enable-windows-desktop
          flutter create --org com.mographiccode --project-name local_share --platforms=windows generated
          Remove-Item generated/lib -Recurse -Force
          Remove-Item generated/test -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item flutter_local_share/lib generated/lib -Recurse
          Copy-Item flutter_local_share/test generated/test -Recurse
          Copy-Item flutter_local_share/pubspec.yaml generated/pubspec.yaml -Force
      - name: Analyze test and build Windows
        working-directory: generated
        shell: pwsh
        run: |
          flutter pub get
          dart format lib test
          flutter analyze --no-fatal-infos
          flutter test
          flutter build windows --release
      - name: Package Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $release = (Resolve-Path 'generated/build/windows/x64/runner/Release').Path
          Compress-Archive -Path "$release/*" -DestinationPath 'artifacts/LocalShare-Windows-Portable.zip' -Force
          $iss = @"
          [Setup]
          AppId={{8D2D488C-246B-4BDC-8C24-7B10A65B9649}
          AppName=LocalShare
          AppVersion=1.0.0
          AppPublisher=MographicCode
          DefaultDirName={autopf}\LocalShare
          DefaultGroupName=LocalShare
          OutputDir=$($PWD.Path)\artifacts
          OutputBaseFilename=LocalShare-Windows-Setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=admin
          UninstallDisplayIcon={app}\local_share.exe

          [Files]
          Source: "$release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\LocalShare"; Filename: "{app}\local_share.exe"
          Name: "{autodesktop}\LocalShare"; Filename: "{app}\local_share.exe"

          [Run]
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall add rule name=""LocalShare TCP"" dir=in action=allow protocol=TCP localport=40404 profile=private"; Flags: runhidden
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall add rule name=""LocalShare UDP Discovery"" dir=in action=allow protocol=UDP localport=40405 profile=private"; Flags: runhidden
          Filename: "{app}\local_share.exe"; Description: "Launch LocalShare"; Flags: nowait postinstall skipifsilent

          [UninstallRun]
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall delete rule name=""LocalShare TCP"""; Flags: runhidden
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall delete rule name=""LocalShare UDP Discovery"""; Flags: runhidden
          "@
          Set-Content -Path installer.iss -Value $iss -Encoding UTF8
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup 6 is not available.' }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash artifacts/LocalShare-Windows-Setup.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  LocalShare-Windows-Setup.exe" } | Set-Content artifacts/LocalShare-Windows-Setup.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: LocalShare-Windows-V3
          path: artifacts/*
          if-no-files-found: error
