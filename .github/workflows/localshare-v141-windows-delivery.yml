name: LocalShare 1.4.1 Windows Delivery

on:
  push:
    branches: [localshare-1.4.1-windows-delivery]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows project
        shell: pwsh
        run: |
          if (Test-Path generated) { Remove-Item generated -Recurse -Force }
          flutter create --org com.mographiccode --project-name local_share --platforms=windows generated
          Remove-Item generated/lib -Recurse -Force
          Remove-Item generated/test -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item flutter_local_share/lib generated/lib -Recurse
          Copy-Item flutter_local_share/test generated/test -Recurse
          Copy-Item flutter_local_share/pubspec.yaml generated/pubspec.yaml -Force
          python flutter_local_share/tools/patch_windows_temp_cleanup.py generated/windows/runner/main.cpp
          python -m pip install --quiet pillow
          python flutter_local_share/tools/generate_localshare_icon.py localshare_icon.png
          @'
          from PIL import Image
          from pathlib import Path
          src=Image.open('localshare_icon.png').convert('RGBA')
          src.save(Path('generated/windows/runner/resources/app_icon.ico'),sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content icon_build.py -Encoding UTF8
          python icon_build.py
      - name: Analyze test build and background test
        shell: pwsh
        run: |
          Push-Location generated
          flutter pub get
          flutter analyze --fatal-warnings --no-fatal-infos
          flutter test
          flutter build windows --release
          Pop-Location
          $exe=(Resolve-Path 'generated/build/windows/x64/runner/Release/local_share.exe').Path
          $p=Start-Process $exe -PassThru
          Start-Sleep -Seconds 8
          $p.Refresh()
          if ($p.HasExited) { throw 'LocalShare exited before background test' }
          $null=$p.CloseMainWindow()
          Start-Sleep -Seconds 4
          $p.Refresh()
          if ($p.HasExited) { throw 'Closing LocalShare terminated the background process' }
          Stop-Process -Id $p.Id -Force
      - name: Build LAN-safe installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $release=(Resolve-Path 'generated/build/windows/x64/runner/Release').Path
          $icon=(Resolve-Path 'generated/windows/runner/resources/app_icon.ico').Path
          $iss=@"
          [Setup]
          AppId={{8D2D488C-246B-4BDC-8C24-7B10A65B9649}
          AppName=LocalShare
          AppVersion=1.4.1
          AppPublisher=MographicCode LocalShare
          DefaultDirName={autopf}\LocalShare
          DefaultGroupName=LocalShare
          OutputDir=$($PWD.Path)\artifacts
          OutputBaseFilename=LocalShare-1.4.1-Windows-Setup
          SetupIconFile=$icon
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=admin
          UninstallDisplayIcon={app}\local_share.exe
          [Files]
          Source: "$release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{autoprograms}\LocalShare"; Filename: "{app}\local_share.exe"; WorkingDir: "{app}"
          Name: "{autodesktop}\LocalShare"; Filename: "{app}\local_share.exe"; WorkingDir: "{app}"
          [Run]
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall delete rule name=""LocalShare TCP"""; Flags: runhidden
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall delete rule name=""LocalShare UDP Discovery"""; Flags: runhidden
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall add rule name=""LocalShare TCP"" dir=in action=allow protocol=TCP localport=40404 profile=any remoteip=LocalSubnet"; Flags: runhidden
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall add rule name=""LocalShare UDP Discovery"" dir=in action=allow protocol=UDP localport=40405 profile=any remoteip=LocalSubnet"; Flags: runhidden
          [UninstallRun]
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall delete rule name=""LocalShare TCP"""; Flags: runhidden; RunOnceId: "RemoveLocalShareTcp"
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall delete rule name=""LocalShare UDP Discovery"""; Flags: runhidden; RunOnceId: "RemoveLocalShareUdp"
          "@
          Set-Content installer.iss $iss -Encoding UTF8
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash artifacts/LocalShare-1.4.1-Windows-Setup.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  LocalShare-1.4.1-Windows-Setup.exe" } | Set-Content artifacts/LocalShare-1.4.1-Windows-Setup.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: LocalShare-1.4.1-Windows-LAN-Fix
          path: |
            artifacts/LocalShare-1.4.1-Windows-Setup.exe
            artifacts/LocalShare-1.4.1-Windows-Setup.exe.sha256
