name: universal_doc_viewer
description: Production-oriented local document manager and viewer for Android.
publish_to: 'none'
version: 2.6.0+8

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  doc_viewer: 0.0.3
  docx_file_viewer: ^1.0.3
  excel: 4.0.6
  file_picker: ^12.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^13.0.1
  pdfrx: ^2.4.7
  shared_preferences: ^2.5.5
  sqflite: ^2.4.3
  two_dimensional_scrollables: ^0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
