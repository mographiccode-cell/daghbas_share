name: local_share
description: Secure local-network chat and file sharing between Android and Windows.
publish_to: 'none'
version: 1.4.0+7

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  file_picker: ^10.3.10
  flutter_foreground_task: 10.0.0
  flutter_linkify: ^6.0.0
  flutter_local_notifications: ^22.3.0
  flutter_secure_storage: ^10.3.1
  pasteboard: ^0.5.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  tray_manager: ^0.5.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
